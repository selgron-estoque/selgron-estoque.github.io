<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Indicadores - Selgron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
<style>
  /* ---- Variáveis extraídas 1:1 da página Indicadores (index.html) ---- */
  :root{
    --bg: #EEF0F3;
    --panel: #FFFFFF;
    --panel-raised: #F3F5F7;
    --line: #D7DBE1;
    --ink: #1A1C21;
    --ink-dim: #575756;
    --safety: #F6A200;
    --safety-ink: #14161A;
    --ok: #1E8E4F;
    --ok-bg: #E3F6EA;
    --warn: #A35F00;
    --warn-bg: #FFF1D6;
    --danger: #C4291B;
    --danger-bg: #FBE6E3;
    --accent2: #1F6FA8;
    --radius: 10px;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-corp: 'Inter', sans-serif;
    --navy: #0F172A;
    --gray-50: #F8FAFC;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-400: #94A3B8;
    --gray-500: #64748B;
    --text-2xs: 9.5px;
    --text-xs: 11px;
    --text-sm: 12.5px;
    --text-md: 14px;
    --text-lg: 15px;
    --purple: #7B3FC4;
    --purple-bg: #F1E9FB;
    --teal: #0D9488;
    --teal-bg: #E7F6F3;
    --blue: #2A6FD6;
    --blue-bg: #E3EEFC;
    /* Navy FIXO da marca — nunca muda com o tema (mesma decisão de
       `.sidebar` em index.html: "a Sidebar é sempre escura, em qualquer
       tema"). `--navy` sozinho já é redefinido pro tema escuro logo
       abaixo (fica quase branco, papel de TEXTO/borda — mesmo padrão de
       index.html), então qualquer FUNDO que precise continuar
       azul-marinho sólido nos dois temas (`.pnl-topbar`, aba ativa,
       botão primário do modal) usa esta variável, nunca `--navy`. */
    --brand-navy: #0F172A;
  }

  /* TEMA ESCURO — mesmos valores 1:1 de `:root[data-theme="dark"]` em
     index.html (ver lá o comentário completo da decisão de cada token).
     `--brand-navy`/`--safety`/`--safety-ink`/`--accent2` NÃO são
     redefinidos de propósito — cores fixas da marca, iguais nos 2 temas. */
  :root[data-theme="dark"]{
    --bg: #14161B;
    --panel: #23272F;
    --panel-raised: #1A1D24;
    --line: #383D48;
    --ink: #EDEEF2;
    --ink-dim: #9AA0AC;
    --ok: #34D399;
    --ok-bg: #143829;
    --warn: #FBBF24;
    --warn-bg: #3A2A0A;
    --danger: #F87171;
    --danger-bg: #3A1512;
    --navy: #EDEEF2;
    --gray-50: #1A1D24;
    --gray-100: #20242C;
    --gray-200: #383D48;
    --gray-400: #9AA0AC;
    --gray-500: #B7BCC6;
    --purple: #B18AF0;
    --purple-bg: #2A2140;
    --teal: #2DD4C6;
    --teal-bg: #123330;
    --blue: #6FA8F5;
    --blue-bg: #152A42;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);height:100%;}

  /* Ajusta o conteúdo inteiro da aba "Painel Indicadores" (tamanho fixo de
     8 gráficos, sempre a mesma quantidade) pra caber 100% na tela, sem
     cortar nem rolar — encolhe OU amplia (nunca só encolhe) mantendo a
     proporção original, pra aproveitar bem tanto uma tela pequena quanto
     uma TV grande de parede. Não é usado em "Tracking Picking" de propósito:
     lá a lista de ETPs é ilimitada (pode ter poucas ou centenas) — cada
     coluna do Kanban cresce pro tamanho de todos os cards que tiver, sem
     limite de altura nem rolagem própria (pedido do cliente: "quero que
     apareça tudo, se eu quiser ver os itens lá de baixo eu faço a rolagem
     de tela") — é a PÁGINA que rola quando não cabe tudo, nunca escalar o
     texto até ficar ilegível — ver `FitToScreen`/`.fit-screen-*` no script
     abaixo. */
  /* Altura = 100vh MENOS a altura fixa de `.pnl-topbar` (56px, ver mais
     abaixo) — o cabeçalho fica de fora deste wrapper (nunca escala, ver
     comentário em `PainelIndicadores`), então só o espaço que sobra
     embaixo dele deve ser preenchido aqui. */
  .fit-screen-outer{height:calc(100vh - 56px);width:100vw;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  /* Largura FIXA (não 100%/auto) de propósito — um filho de flex sem
     largura definida vira "shrink-to-fit", e todo `width:100%`/`flex`
     interno dos gráficos (que dependem de uma largura definida do
     ancestral pra calcular %) ficaria ambíguo/errado antes da 1ª medição
     do JS. 1600px é bem acima do breakpoint de 1200px em que
     `.weekly-pair-row` já vira grid de 2 colunas (ver acima) — garante que
     o tamanho NATURAL medido pelo JS seja sempre o layout largo de TV,
     nunca a versão empilhada de celular, mesmo numa tela final estreita
     (que só encolhe a versão larga já renderizada, não troca de layout). */
  .fit-screen-inner{width:1600px;transform-origin:center center;}

  .content{padding:24px 40px;max-width:100%;margin:0 auto;}
  /* Só a aba Tracking Picking usa isto (ver comentário completo lá e em
     `.tp-board`) — `min-height` (nunca `height`/`overflow:hidden`)
     de propósito: garante um piso de altura igual sempre (o Kanban
     estica até preencher, mesmo vazio), mas ainda deixa crescer além
     disso e a PÁGINA rolar quando tem card demais pra caber — mesma
     regra de sempre desta tela, só que agora sem "pular" de tamanho
     quando a linha selecionada muda. */
  .content-tracking{min-height:calc(100vh - 56px);display:flex;flex-direction:column;box-sizing:border-box;}

  /* Cabeçalho único (barra azul-marinho), réplica fiel de referência visual
     passada pelo cliente — substitui o antigo cabeçalho em 2 blocos (barra
     de abas clara + faixa branca com logo grande/título embaixo, que não
     existe mais). Fica FORA de `.content` de propósito (`PanelTabs`
     renderizado como irmão de `.content`, não filho) — só assim ocupa a
     largura inteira, sem herdar o padding de 24px/40px do corpo da página. */
  .pnl-topbar{background:var(--brand-navy);display:flex;align-items:center;height:56px;padding:0 20px;}
  /* Logo original é colorida (laranja/navy) — filtro padrão pra virar
     silhueta branca sólida, preservando a transparência do PNG (não existe
     nenhuma versão branca do arquivo, só a colorida usada no resto do
     app). */
  .pnl-topbar-logo{height:17.6px;width:auto;display:block;flex-shrink:0;filter:brightness(0) invert(1);}
  .pnl-topbar-sep{width:1px;height:24px;background:rgba(255,255,255,0.16);margin:0 16px;flex-shrink:0;}
  .pnl-topbar-tab{display:flex;align-items:center;gap:8px;height:100%;background:none;border:none;padding:0;cursor:pointer;font-family:var(--font-corp);font-size:var(--text-md);font-weight:600;color:rgba(255,255,255,0.55);white-space:nowrap;}
  .pnl-topbar-tab.active{color:#fff;}
  .pnl-topbar-icon-btn{background:none;border:none;padding:8px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,0.7);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pnl-topbar-icon-btn:hover{background:rgba(255,255,255,0.1);color:#fff;}
  .pnl-topbar-right{margin-left:auto;display:flex;align-items:center;gap:18px;flex-shrink:0;}

  /* Switch de tema — cópia 1:1 de `.theme-switch` (index.html,
     DesktopTopbar), mesmo pedido do cliente: "deixar o botão igual a
     este". */
  .theme-switch{position:relative;width:44px;height:24px;border-radius:999px;border:none;background:var(--gray-200);flex-shrink:0;cursor:pointer;padding:0;transition:background-color .2s ease;}
  .theme-switch:hover{filter:brightness(0.95);}
  .theme-switch.on{background:var(--safety);}
  .theme-switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:var(--gray-500);transition:left .2s ease,color .2s ease;}
  .theme-switch.on .knob{left:22px;color:var(--safety);}

  .panel-tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .panel-tab-btn{font-family:var(--font-display);font-size:var(--text-md);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;color:var(--ink-dim);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 22px;cursor:pointer;transition:background .15s,color .15s;}
  .panel-tab-btn:hover{color:var(--navy);}
  .panel-tab-btn.active{background:var(--brand-navy);color:#fff;border-color:var(--brand-navy);}

  @media (max-width:760px){
    .pnl-topbar{padding:0 12px;}
    .pnl-topbar-sep{margin:0 10px;}
    .pnl-topbar-tab-label{display:none;}
    .pnl-topbar-right{gap:10px;}
  }

  .demo-banner{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(163,95,0,0.25);border-radius:var(--radius);padding:12px 16px;font-size:var(--text-sm);margin-bottom:20px;}

  .section-title{font-family:var(--font-display);font-size:var(--text-sm);text-transform:uppercase;letter-spacing:1px;color:var(--ink-dim);margin:24px 0 12px 0;display:flex;align-items:center;gap:8px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:0;box-shadow:0 1px 2px rgba(15,23,42,.03);}

  .weekly-charts-grid{margin-bottom:0;margin-top:20px;}
  .weekly-pair-row{display:flex;flex-direction:column;gap:16px;margin-bottom:16px;}
  @media (min-width:1200px){.weekly-pair-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}}

  .chart-meta-badge{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:700;color:var(--teal);background:rgba(13,148,136,0.12);border-radius:6px;padding:4px 9px;white-space:nowrap;}

  /* ---- 1ª linha de KPIs (resumo executivo, acima dos gráficos) — 4 cards
     SEMPRE em 1 única linha (pedido do cliente), altura fixa igual nos 4.
     `.kpi-row` só quebra pra 2/1 coluna em telas realmente estreitas (esta
     página também abre num navegador comum, fora da TV, pra teste/preview)
     — na TV (1920×1080) o `FitToScreen` acima já renderiza tudo num canvas
     de 1600px de largura fixa, então as 4 colunas sempre cabem lado a lado
     de verdade. */
  .kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:12px 0 16px 0;}
  @media (max-width:1000px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.kpi-row{grid-template-columns:1fr;}}
  /* Estrutura reconstruída pra ELIMINAR o corte de texto, não só disfarçar
     com reticência: o TÍTULO/PERÍODO (cabeçalho) ficam numa linha de grid
     PRÓPRIA que ocupa a largura INTEIRA do card (menos o ícone) — não
     dividem espaço horizontal com a coluna secundária nenhuma hora. Só o
     CORPO (número/meta + coluna secundária), que fica numa 2ª linha do
     grid, é que se divide em 2 colunas. `grid-template-rows:48px
     minmax(0,1fr)` fixa a altura do cabeçalho em 48px sempre — é isso (e
     não `align-items:center`) que garante título/período/ícone na MESMA
     posição Y nos 4 cards, não importa quanto texto cada um tem embaixo.
     Medido via layout real: essa estrutura dá ~258px de largura pro
     cabeçalho (título+período), contra os ~150-170px da tentativa
     anterior (que dividia essa largura com a coluna secundária) — cabe o
     título mais comprido ("Acuracidade (itens recontados)") por inteiro,
     sem precisar de reticência. */
  .kpi-card{height:178px;box-sizing:border-box;padding:16px;background:var(--panel-raised);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .kpi-card-content{display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);column-gap:14px;height:100%;}
  /* Ícone ocupa as 2 linhas do grid (`grid-row:1/3`) mas fica ANCORADO no
     topo (`align-self:start`), alinhado com o título — não centralizado
     no card inteiro (isso é o que a seção "não usar align-items:center
     pra centralizar tudo" pedia: cada peça tem posição fixa, não uma
     posição calculada por centralização). */
  .kpi-card-icon{grid-row:1 / 3;grid-column:1;width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;align-self:start;justify-self:center;}
  .kpi-card-header{grid-row:1;grid-column:2;min-width:0;}
  .kpi-card-titulo{font-size:14px;font-weight:600;line-height:18px;height:18px;color:var(--ink);white-space:nowrap;}
  .kpi-card-periodo{font-size:12px;line-height:16px;height:16px;color:var(--ink-dim);margin-top:2px;white-space:nowrap;}
  .kpi-card-body{grid-row:2;grid-column:2;min-height:0;display:flex;flex-direction:column;justify-content:space-between;padding-top:6px;box-sizing:border-box;}
  .kpi-card-body-row{display:flex;gap:16px;}
  .kpi-card-primary{flex:1;min-width:0;display:flex;flex-direction:column;}
  .kpi-card-valor{font-family:var(--font-mono);font-size:40px;font-weight:700;line-height:40px;color:var(--ink);}
  .kpi-card-meta{font-size:14px;font-weight:600;line-height:18px;color:var(--ink);margin-top:2px;}
  /* Largura fixa medida pra caber o rótulo mais comprido ("Itens com
     divergência") + valor, sem reticência — ver comentário acima sobre a
     largura real disponível. */
  .kpi-card-secondary{width:158px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .kpi-card-info-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px;font-weight:400;color:var(--ink-dim);line-height:22px;white-space:nowrap;}
  .kpi-card-info-row .v{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;}
  /* Coluna secundária alternativa (card de Divergências: percentual em
     destaque + tendência, no lugar das 3 linhas rótulo/valor). */
  .kpi-card-secondary .pct{font-size:20px;font-weight:700;line-height:22px;color:var(--ink);}
  .kpi-card-secondary .txt{font-size:12px;font-weight:400;color:var(--ink-dim);line-height:16px;}
  .kpi-card-secondary .trend-valor{font-size:14px;font-weight:700;line-height:18px;margin-top:6px;}
  .kpi-card-secondary .trend-texto{font-size:12px;font-weight:400;color:var(--ink-dim);line-height:16px;}
  /* Barra de progresso (só o Card 3/Contagens usa) — dentro do body, numa
     faixa própria no rodapé (`justify-content:space-between` do
     `.kpi-card-body` empurra ela pro fim, sempre dentro da altura fixa). */
  .kpi-card-progress{margin-top:8px;}
  .kpi-card-progress-labels{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:var(--ink-dim);margin-bottom:4px;}
  .kpi-card-progress-labels .v{font-weight:600;color:var(--ink);}
  .kpi-card-progress-track{height:6px;border-radius:999px;background:var(--line);overflow:hidden;}
  .kpi-card-progress-fill{height:100%;border-radius:999px;background:var(--purple);}
  @media (max-width:560px){
    .kpi-card{height:auto;}
  }

  /* ---- Modal de configuração "Quais indicadores aparecem" — CSS
     duplicado 1:1 de `.modal-*` (index.html), mesmo motivo/mesma decisão
     de arquitetura do resto deste arquivo. ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:var(--panel);border-radius:var(--radius);box-shadow:0 8px 24px rgba(15,23,42,.12);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;}
  .modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .modal-title{font-size:var(--text-lg);font-weight:700;color:var(--ink);}
  .modal-subtitle{font-size:var(--text-xs);color:var(--ink-dim);margin-top:4px;line-height:1.5;}
  .modal-close-btn{background:none;border:none;cursor:pointer;color:var(--ink-dim);padding:4px;border-radius:6px;display:flex;flex-shrink:0;}
  .pnl-cfg-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;border:1px solid var(--line);margin-bottom:8px;}
  .pnl-cfg-item label{flex:1;font-size:var(--text-sm);color:var(--ink);display:flex;align-items:center;gap:9px;cursor:pointer;}
  .pnl-cfg-arrows{display:flex;gap:4px;}
  .pnl-cfg-arrows button{background:var(--panel-raised);border:1px solid var(--line);border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-dim);}
  .pnl-cfg-arrows button:disabled{opacity:.35;cursor:default;}
  .pnl-cfg-btn{font-family:var(--font-display);font-size:var(--text-sm);text-transform:uppercase;letter-spacing:0.4px;font-weight:600;padding:11px 18px;border-radius:var(--radius);border:none;cursor:pointer;}
  .pnl-cfg-btn-primary{background:var(--brand-navy);color:#fff;}
  .pnl-cfg-btn-outline{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}
  .pnl-cfg-btn:disabled{opacity:.5;cursor:default;}

  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .bar-row .bl{width:200px;font-size:var(--text-sm);color:var(--ink-dim);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:22px;background:var(--panel-raised);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--teal);border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;}
  .bar-fill span{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:700;color:#fff;white-space:nowrap;}

  .pnl-donut-wrap{display:flex;flex-direction:column;align-items:center;gap:24px;padding-top:8px;}
  .pnl-donut-legend{display:flex;flex-direction:column;gap:10px;width:100%;}
  .pnl-legend-row{display:flex;align-items:center;gap:8px;font-size:var(--text-sm);color:var(--navy);}
  .pnl-legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
  .pnl-legend-row .n{margin-left:auto;font-weight:600;font-family:var(--font-corp);}

  .empty-msg{color:var(--ink-dim);font-size:var(--text-sm);padding:20px 0;text-align:center;}

  /* ---- Tracking Picking: redesign visual (pedido do cliente, spec de 32
     seções + imagem de referência) — SÓ visual: lógica/dados/filtros/
     navegação/status continuam 100% os mesmos de antes (`TrackingPicking`/
     `TrackingPickingBoard`/`computeMaquinasPainelTracking` em JS, sem
     mudança de comportamento). Variáveis `--tp*` escopadas em `.tp-page`
     (mesma técnica de `.pc-page` logo abaixo: um prefixo próprio, nunca
     sobrescrevendo `--bg`/`--panel`/etc. globais) — MAS, ao contrário de
     `.pc-page` (sempre escuro), aqui os 2 blocos (`:root .tp-page` claro,
     `:root[data-theme="dark"] .tp-page` escuro) existem de propósito:
     cliente confirmou que o botão de tema clara/escuro desta tela deve
     continuar funcionando (diferente de Pedidos de Compra, que é sempre
     escuro). O bloco escuro usa os hex exatos da referência; o claro
     reaproveita os tokens claros já existentes no resto do app (mesma
     relação de cor por status: aguardando=laranja/warn, em
     separação=teal, separada=verde/ok, entregue=azul/blue), já que a
     spec não trouxe uma versão clara. */
  .tp-page{
    --tpbg: var(--bg); --tpcard: var(--panel); --tpcardborder: var(--line);
    --tpcardshadow: 0 1px 3px rgba(15,23,42,.08);
    --tptrack: var(--line); --tpfill: var(--ok);
    --tpcomsaldo-bg: var(--ok-bg); --tpcomsaldo-ink: var(--ok);
    --tpsemsaldo-bg: var(--danger-bg); --tpsemsaldo-ink: var(--danger);
    --tpcol-aguardando-bg: var(--warn-bg); --tpcol-aguardando-ink: var(--warn);
    --tpcol-emsep-bg: var(--teal-bg); --tpcol-emsep-ink: var(--teal);
    --tpcol-separada-bg: var(--ok-bg); --tpcol-separada-ink: var(--ok);
    --tpcol-entregue-bg: var(--blue-bg); --tpcol-entregue-ink: var(--blue);
    --tpink: var(--ink); --tpink-dim: var(--ink-dim); --tpsep: var(--ink-dim);

function usePersistedTheme(){
  const [theme, setTheme] = useState(() => {
    try{ return localStorage.getItem('theme') || 'light'; }catch(_e){ return 'light'; }

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try{ localStorage.setItem('theme', theme); }catch(_e){ /* localStorage indisponível (modo privado) — tema só não persiste entre sessões */ }
  }, [theme]);
  function toggleTheme(){ setTheme(t => t==='dark' ? 'light' : 'dark'); }

}

// Login automático da TV — pra esta página carregar dado AO VIVO mesmo
// aberta direto (sem passar pelo app logado antes, ex.: favorito/atalho
// numa TV do almoxarifado). Usuário DEDICADO, criado em "Gerenciar
// usuários" (Admin) só pra isso — perfil "Operador", com só 2 acessos
// extras liberados: "Programação" (pra Tracking Picking ler
// maquinas_etp/sequencia_separacao) e "Indicadores" (pra poder salvar a
// configuração de quais gráficos aparecem em painel_indicadores_config —
// ver ConteudoConfigIndicadores). Nenhuma outra tela — `tem_acesso_tela`
// nega o resto.
//
// ATENÇÃO — mesmo aviso que já vale pra SUPABASE_PUBLISHABLE_KEY acima:
// qualquer texto aqui fica visível pra quem ver o código-fonte desta
// página (é um arquivo estático público, sem servidor por trás). Por isso
// esta senha NUNCA deve ser reaproveitada em nenhuma outra conta — é
// visível publicamente a partir daqui.
const TV_LOGIN_IDENTIFIER = 'tv.almox';
const TV_LOGIN_SENHA = 'Nova@2026';

async function tentarLoginSilenciosoTv(){
  if(!supabaseClient || !TV_LOGIN_IDENTIFIER || !TV_LOGIN_SENHA) return false;
  try{
    const { data, error } = await supabaseClient.functions.invoke('auth-publico', {
      body: {acao:'login', identifier: TV_LOGIN_IDENTIFIER, senha: TV_LOGIN_SENHA},
    });
    if(error || !data || !data.ok || !data.access_token) return false;
    const { error: setErr } = await supabaseClient.auth.setSession({
      access_token: data.access_token, refresh_token: data.refresh_token,
    });
    return !setErr;
  }catch(err){
    console.warn('Painel Indicadores: falha no login automático da TV', err);
    return false;
  }
}

// Realtime só entrega evento pra quem RECEBE se o socket estiver
// autenticado (RLS de `contagens` exige auth.role()='authenticated') — sem
// isso a conexão do Realtime fica anônima por padrão. Mesmo helper/mesmo
// motivo já usados em index.html (sincronizarAuthRealtime, perto de
// `App()`) — chamado sempre que a sessão é confirmada/atualiza.
function sincronizarAuthRealtime(session){
  if(supabaseClient && supabaseClient.realtime && typeof supabaseClient.realtime.setAuth==='function'){
    supabaseClient.realtime.setAuth(session ? session.access_token : null);
  }
}

/* ---- Helpers puros, copiados de index.html ---- */

function reconstructNumericCode(raw){
  let d = String(raw).trim();
  if(!/^[0-9]+$/.test(d)) return d;
  if(d.length===10) d = '0'+d;
  if(d.length===11) return d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,11);
  if(d.length===9) return d.slice(0,3)+'.'+d.slice(3,8)+'.'+d.slice(8,9);
  if(d.length===8) return d.slice(0,3)+'.'+d.slice(3,8);
  return d;
}

function contagemRowToLocal(row){
  return {
    id: row.id,
    productCode: reconstructNumericCode(row.produto_codigo),
    descricao: row.descricao,
    diferenca: row.diferenca,
    saldoSistema: row.saldo_sistema,
    familia: row.familia,
    contagemAnteriorId: row.contagem_anterior_id,
    data: row.data,
    // Só existe pra filtrar `OPEN_STATUSES` no cálculo "Acuracidade (itens
    // recontados)" (mesmo critério exato de `todasParaQualidade` na aba
    // Acuracidade, index.html) — nenhum outro card/gráfico deste painel usa
    // este campo.
    statusAprovacao: row.status_aprovacao,
  };
}

// Mesma lista EXATA de index.html — contagem ainda pendente de decisão
// (aguardando segunda contagem, análise do líder, SA do armazém ou
// aprovação da diretoria) não pode contar como "avaliada" na fórmula
// "Itens Recorrentes": ela ainda não tem um resultado final, e por
// definição tende a ser divergente (é POR ISSO que ainda está em
// tratativa) — sem este filtro, o card inflava avaliados/divergentes com
// contagens que a aba Acuracidade real já exclui.
const OPEN_STATUSES = ['aguardando_segunda', 'aguardando_analise_lider', 'aguardando_solicitacao_armazem', 'aguardando_aprovacao_diretoria'];

async function fetchTodasPaginado(buildQuery){
  const PAGE_SIZE = 1000;
  let offset = 0;
  let todas = [];
  while(true){
    const { data, error } = await buildQuery().range(offset, offset + PAGE_SIZE - 1);
    if(error) throw error;
    if(!data || data.length === 0) break;
    todas = todas.concat(data);
    if(data.length < PAGE_SIZE) break;
    offset += PAGE_SIZE;
  }
  return todas;
}

// Select enxuto (só as colunas que os gráficos deste painel usam) — não
// precisa da linha inteira de `contagens` como index.html busca (lá é
// usada pra dezenas de outras telas, aqui só pros 6 gráficos abaixo).
async function fetchContagensParaPainel(){
  if(!supabaseClient) return [];
  const data = await fetchTodasPaginado(() => supabaseClient
    .from('contagens')
    .select('id, produto_codigo, descricao, diferenca, saldo_sistema, familia, contagem_anterior_id, data, status_aprovacao')
    .order('criado_em', {ascending:false})
    .order('id', {ascending:true}));
  return data.map(contagemRowToLocal);
}

async function fetchHistoricoParaTendencia(){
  if(!supabaseClient) return [];
  const data = await fetchTodasPaginado(() => supabaseClient
    .from('contagens_historico')
    .select('id, produto_codigo, data, diferenca, saldo_sistema, acuracidade, status')
    .order('data', {ascending:false})
    .order('id', {ascending:true}));
  return data.filter(row => !['Recontar','Ajustar'].includes(String(row.status||'').trim()));
}

// "Cobertura da Programação" (card de KPI novo) precisa de `inventarios`
// (Programado=qtd_itens, Contado=contados) — tabela real que já existe no
// Supabase e já é usada por index.html, só que este arquivo não buscava
// até aqui (só usava `contagens`/`contagens_historico`). Select enxuto,
// mesmo critério de `fetchContagensParaPainel`. `status!='cancelado'` =
// carga de trabalho ATUAL (inventário cancelado não deve contar nem como
// Programado nem como Contado).
async function fetchInventariosParaPainel(){
  if(!supabaseClient) return [];
  const data = await fetchTodasPaginado(() => supabaseClient
    .from('inventarios')
    .select('id, qtd_itens, contados, status')
    .neq('status', 'cancelado'));
  return data.map(row => ({
    qtdItens: Number(row.qtd_itens) || 0,
    contados: Number(row.contados) || 0,
  }));
}

function ultimaContagemPorDocumento(pool){
  const hasFollowUp = new Set();
  pool.forEach(c=>{ if(c.contagemAnteriorId) hasFollowUp.add(c.contagemAnteriorId); });
  return pool.filter(c=>c.id==null || !hasFollowUp.has(c.id));
}

function getWeekInfo(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const dow = (d.getDay() + 6) % 7;
  const monday = new Date(d);
  monday.setDate(d.getDate() - dow);
  const key = monday.toISOString().slice(0, 10);
  const thursday = new Date(monday);
  thursday.setDate(monday.getDate() + 3);
  const yearStart = new Date(Date.UTC(thursday.getFullYear(), 0, 1));
  const weekNumber = Math.ceil((((thursday - yearStart) / 86400000) + 1) / 7);
  return {
    key,
    weekNumber,
    label: 'Sem ' + weekNumber,
    sublabel: monday.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}),
  };
}

const NOMES_MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function getMonthInfo(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  return {
    key,
    label: NOMES_MESES[d.getMonth()],
    sublabel: String(d.getFullYear()),
  };
}

function itemAcuracidade(c){
  if(c.acuracidade!=null) return c.acuracidade;
  if(c.saldoSistema==null || c.diferenca==null) return null;
  if(c.saldoSistema===0) return c.diferenca===0 ? 1 : 0;
  return Math.max(0, 1 - Math.abs(c.diferenca)/c.saldoSistema);
}

function localDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function hojeLocalStr(){
  return localDateStr(new Date());
}

// 'YYYY-MM-DD' → 'DD/MM' — só pro rótulo de período dos cards de KPI
// (ex.: "Semana atual (15/09 a 21/09)").
function formatDDMM(dataStr){
  if(!dataStr) return '';
  const [, m, d] = dataStr.split('-');
  return d + '/' + m;
}

// Dia-a-dia da semana ATUAL (segunda a domingo) — só pro card de KPI
// "Contagens na Semana" (média diária/maior dia/menor dia). `poolDedup` já
// precisa vir deduplicado (1 linha por item, `ultimaContagemPorDocumento`)
// e filtrado pra essa semana.
function computeDiasSemanaAtual(poolDedup, segundaFeiraStr){
  const dias = [];
  const cursor = new Date(segundaFeiraStr + 'T00:00:00');
  for(let i=0;i<7;i++){
    dias.push({data: localDateStr(cursor), total: 0});
    cursor.setDate(cursor.getDate()+1);
  }
  const porData = {};
  dias.forEach(d=>{ porData[d.data] = d; });
  poolDedup.forEach(c=>{
    if(c.data && porData[c.data]) porData[c.data].total += 1;
  });
  return dias;
}

// Painel fica sempre numa TV, sem controle de filtro interativo — período
// fixo em "últimos 60 dias" (~8-9 semanas), janela parecida com o que o
// cliente costuma olhar na tela Indicadores. Fácil de trocar aqui se
// precisar de outra janela padrão.
function computeTrendRangeFixo(hojeStr){
  const hoje = new Date(hojeStr + 'T00:00:00');
  const d = new Date(hoje); d.setDate(d.getDate() - 59);
  return { from: d.toISOString().slice(0,10), to: hojeStr };
}

function computeWeeklyStats(counts, dataInicioStr, dataFimStr){
  const buckets = {};
  const ordem = [];
  let cursor = new Date(getWeekInfo(dataInicioStr).key + 'T00:00:00');
  const fimMonday = new Date(getWeekInfo(dataFimStr).key + 'T00:00:00');
  let guard = 0;
  while(cursor <= fimMonday && guard < 300){
    const info = getWeekInfo(cursor.toISOString().slice(0,10));
    if(!buckets[info.key]){
      buckets[info.key] = {key:info.key, label:info.label, sublabel:info.sublabel, total:0, somaAcuracidade:0, comAcuracidade:0};
      ordem.push(info.key);
    }
    cursor.setDate(cursor.getDate()+7);
    guard++;
  }
  counts.forEach(c=>{
    if(!c.data) return;
    if(c.data<dataInicioStr || c.data>dataFimStr) return;
    const {key} = getWeekInfo(c.data);
    if(!buckets[key]) return;
    buckets[key].total += 1;
    const acc = itemAcuracidade(c);
    if(acc!=null){
      buckets[key].somaAcuracidade += acc;
      buckets[key].comAcuracidade += 1;
    }
  });
  return ordem.map(key=>{
    const w = buckets[key];
    return {
      key:w.key, label:w.label, sublabel:w.sublabel, total:w.total,
      acuracidade: w.comAcuracidade>0 ? (w.somaAcuracidade/w.comAcuracidade)*100 : null,
    };
  });
}

function computeMonthlyStats(counts, dataInicioStr, dataFimStr){
  const buckets = {};
  const ordem = [];
  let cursor = new Date(dataInicioStr + 'T00:00:00');
  cursor.setDate(1);
  const fim = new Date(dataFimStr + 'T00:00:00');
  fim.setDate(1);
  let guard = 0;
  while(cursor <= fim && guard < 120){
    const info = getMonthInfo(cursor.toISOString().slice(0,10));
    if(!buckets[info.key]){
      buckets[info.key] = {key:info.key, label:info.label, sublabel:info.sublabel, total:0, somaAcuracidade:0, comAcuracidade:0};
      ordem.push(info.key);
    }
    cursor.setMonth(cursor.getMonth()+1);
    guard++;
  }
  counts.forEach(c=>{
    if(!c.data) return;
    const {key} = getMonthInfo(c.data);
    if(!buckets[key]) return;
    buckets[key].total += 1;
    const acc = itemAcuracidade(c);
    if(acc!=null){
      buckets[key].somaAcuracidade += acc;
      buckets[key].comAcuracidade += 1;
    }
  });
  return ordem.map(key=>{
    const w = buckets[key];
    return {
      key:w.key, label:w.label, sublabel:w.sublabel, total:w.total,
      acuracidade: w.comAcuracidade>0 ? (w.somaAcuracidade/w.comAcuracidade)*100 : null,
    };
  });
}

function buildPoolTendencia(counts, historicoParaTendencia){
  const historicoComoContagem = (historicoParaTendencia||[])
    .filter(h=>h.data)
    .map(h=>({data:h.data, diferenca:h.diferenca, saldoSistema:h.saldo_sistema, acuracidade:h.acuracidade}));
  return [...counts, ...historicoComoContagem];
}

// Mesma lista EXATA de index.html (`HISTORICO_STATUS_CONCLUIDOS`) — só
// histórico com veredito final entra no cálculo "Acuracidade (itens
// recontados)". `historicoParaTendencia`/`buildPoolTendencia` (acima) é de
// propósito mais ABRANGENTE (mantém "Pendente" etc., pro gráfico de
// tendência semanal — mesmo critério de `fetchContagensHistoricoParaTendencia`
// em index.html: "um item pendente É uma contagem real que aconteceu
// naquele dia"), então não serve pra esta conta — precisa da mesma fonte
// restrita que `historicoConcluidas` já é na aba Acuracidade real.
const HISTORICO_STATUS_CONCLUIDOS = ['OK', 'Sem Ajuste', 'Ajustado'];

// Pool dedicado ao card "Acuracidade (itens recontados)" — não reaproveita
// `poolTendenciaDedup` (que existe pro gráfico de tendência e por isso usa
// o histórico "abrangente" acima). Preserva `productCode` (histórico
// abrangente não precisa dele, mas este cálculo agrupa por produto) e já
// filtra o histórico só pros 3 status concluídos, igual a `historicoConcluidas`
// (index.html) — sem essa restrição, `poolTendenciaDedup` incluía linha de
// histórico "Pendente" que a aba Acuracidade real nunca conta, inflando o
// total (bug real reportado pelo cliente comparando com o drill-down: card
// mostrando 86 avaliados/24 divergentes contra 75/13 do drill-down real).
function buildPoolItensRecorrentes(counts, historicoParaTendencia){
  const historicoConcluidoComProductCode = (historicoParaTendencia||[])
    .filter(h=>h.data && HISTORICO_STATUS_CONCLUIDOS.includes(String(h.status||'').trim()))
    .map(h=>({productCode: reconstructNumericCode(h.produto_codigo), data:h.data, diferenca:h.diferenca, saldoSistema:h.saldo_sistema, acuracidade:h.acuracidade}));
  return ultimaContagemPorDocumento([...counts, ...historicoConcluidoComProductCode])
    .filter(c=>!OPEN_STATUSES.includes(c.statusAprovacao));
}

// Portado de index.html (AcuracidadePanel/"Acuracidade Mensal — Itens
// Recorrentes") — mesma fórmula EXATA, pedido do cliente: o 2º card de KPI
// deste painel precisa usar "o mesmo cálculo da aba Acuracidade", não uma
// aproximação. Só itens com 2+ documentos de contagem no histórico entram
// (já recontados pelo menos uma vez) — item com 1 documento só fica de
// fora por completo, nunca é fabricado como 100%/0%. Versão enxuta da
// original (sem `documentosPorMes`/`evolucao` — esse drill-down não existe
// aqui, só o card de KPI precisa do número mensal).
function computeAcuracidadeItensRecorrentes(pool, dataInicioStr, dataFimStr){
  const porCodigo = {};
  pool.forEach(c=>{
    if(!c.data || !c.productCode) return;
    (porCodigo[c.productCode] = porCodigo[c.productCode] || []).push(c);
  });
  const elegiveis = [];
  Object.values(porCodigo).forEach(arr=>{
    if(arr.length < 2) return; // regra fundamental: só itens com 2+ documentos
    elegiveis.push(...arr);
  });
  const monthlyStats = computeMonthlyStats(elegiveis, dataInicioStr, dataFimStr);
  return { monthlyStats, elegiveis };
}

function niceAxisTicks(maxVal, targetTicks){
  if(maxVal<=0) return [0, 10];
  const rawStep = maxVal / targetTicks;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const residual = rawStep / magnitude;
  const niceResidual = residual<=1 ? 1 : residual<=2 ? 2 : residual<=5 ? 5 : 10;
  const step = niceResidual * magnitude;
  const ticks = [0];
  while(ticks[ticks.length-1] < maxVal - 1e-9) ticks.push(ticks[ticks.length-1] + step);
  return ticks;
}

// `var(--teal)` (não um hex fixo) — SVG aceita `var()` em atributo de
// apresentação (fill/stroke), resolvido pela cascata de CSS normalmente,
// então já adapta sozinho ao tema claro/escuro (`--teal` muda de valor em
// `:root[data-theme="dark"]`) sem precisar passar `theme` por prop pra
// dentro de cada gráfico.
const WEEKLY_CHART_COLOR = 'var(--teal)';
const META_ACURACIDADE_SEMANAL = 95;
const META_CONTAGENS_SEMANAL = 250;

/* ---- Componentes de gráfico, copiados de index.html ---- */

function WeeklyLineChart({weeks, meta=META_ACURACIDADE_SEMANAL}){
  const W = 950, H = 260, padL = 40, padR = 40, padT = 40, padB = 48;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const n = weeks.length;
  const x = i => padL + (n>1 ? (i/(n-1))*chartW : chartW/2);
  const y = v => padT + chartH - (v/100)*chartH;
  const segmentos = [];
  let atual = [];
  weeks.forEach((w,i)=>{
    if(w.acuracidade!=null) atual.push(i);
    else if(atual.length){ segmentos.push(atual); atual = []; }
  });
  if(atual.length) segmentos.push(atual);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}} role="img" aria-label="Gráfico de acuracidade semanal">
      {[0,25,50,75,100].map(t=>(
        <g key={t}>
          <line x1={padL} x2={W-padR} y1={y(t)} y2={y(t)} stroke="var(--line)" strokeWidth={1} strokeDasharray="3,3" />
          <text x={padL-8} y={y(t)+3.5} textAnchor="end" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{t}%</text>
        </g>
      ))}
      <line x1={padL} x2={W-padR} y1={y(meta)} y2={y(meta)} stroke={WEEKLY_CHART_COLOR} strokeWidth={1.5} strokeDasharray="5,4" opacity={0.65}>
        <title>Meta: {meta}%</title>
      </line>
      {segmentos.map((seg,si)=>{
        const pts = seg.map(i=>`${x(i)},${y(weeks[i].acuracidade)}`).join(' ');
        const area = `${x(seg[0])},${y(0)} ${pts} ${x(seg[seg.length-1])},${y(0)}`;
        return (
          <g key={si}>
            <polygon points={area} fill={WEEKLY_CHART_COLOR} opacity={0.12} />
            <polyline points={pts} fill="none" stroke={WEEKLY_CHART_COLOR} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round" />
          </g>
        );
      })}
      {weeks.map((w,i)=>{
        const anchor = i===0 ? 'start' : (i===weeks.length-1 ? 'end' : 'middle');
        const labelX = i===0 ? x(i)+5 : (i===weeks.length-1 ? x(i)-5 : x(i));
        return (
        <g key={w.key}>
          {w.acuracidade!=null ? (
            <>
              <circle cx={x(i)} cy={y(w.acuracidade)} r={4} fill={WEEKLY_CHART_COLOR} stroke="var(--panel)" strokeWidth={2}>
                <title>{w.label} ({w.sublabel}): {w.acuracidade.toFixed(1)}% · {w.total} contagem(ns)</title>
              </circle>
              <text x={labelX} y={Math.max(y(w.acuracidade)-11, padT+14)} textAnchor={anchor} fontSize={11} fontWeight={700} fill="var(--ink)" fontFamily="var(--font-mono)">{Math.round(w.acuracidade)}%</text>
            </>
          ) : (
            <circle cx={x(i)} cy={y(0)} r={2.5} fill="var(--ink-dim)" opacity={0.5}>
              <title>{w.label} ({w.sublabel}): sem contagens</title>
            </circle>
          )}
          <text x={x(i)} y={H-24} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{w.label}</text>
          <text x={x(i)} y={H-11} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{w.sublabel}</text>
        </g>
        );
      })}
    </svg>
  );
}

function WeeklyCountChart({weeks, meta=META_CONTAGENS_SEMANAL}){
  const W = 950, H = 260, padL = 40, padR = 40, padT = 40, padB = 48;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const n = weeks.length;
  const ticks = niceAxisTicks(Math.max(...weeks.map(w=>w.total), meta, 1), 4);
  const maxVal = ticks[ticks.length-1];
  const slot = chartW / n;
  const barW = Math.min(40, slot * 0.5);
  const x = i => padL + i*slot + slot/2;
  const y = v => padT + chartH - (v/maxVal)*chartH;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}} role="img" aria-label="Gráfico de contagens por semana">
      {ticks.map(t=>(
        <g key={t}>
          <line x1={padL} x2={W-padR} y1={y(t)} y2={y(t)} stroke="var(--line)" strokeWidth={1} strokeDasharray="3,3" />
          <text x={padL-8} y={y(t)+3.5} textAnchor="end" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{Math.round(t)}</text>
        </g>
      ))}
      <line x1={padL} x2={W-padR} y1={y(meta)} y2={y(meta)} stroke={WEEKLY_CHART_COLOR} strokeWidth={1.5} strokeDasharray="5,4" opacity={0.65}>
        <title>Meta: {meta}</title>
      </line>
      {weeks.map((w,i)=>(
        <g key={w.key}>
          <rect x={x(i)-barW/2} y={y(w.total)} width={barW} height={Math.max(0, y(0)-y(w.total))} rx={4} fill={WEEKLY_CHART_COLOR}>
            <title>{w.label} ({w.sublabel}): {w.total} contagem(ns)</title>
          </rect>
          <text x={x(i)} y={y(w.total)-8} textAnchor="middle" fontSize={11} fontWeight={700} fill="var(--ink)" fontFamily="var(--font-mono)">{w.total}</text>
          <text x={x(i)} y={H-24} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{w.label}</text>
          <text x={x(i)} y={H-11} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{w.sublabel}</text>
        </g>
      ))}
    </svg>
  );
}

function MonthlyAccuracyBarChart({months, meta=META_ACURACIDADE_SEMANAL}){
  const W = 950, H = 260, padL = 40, padR = 40, padT = 44, padB = 48;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const n = months.length;
  const slot = chartW / n;
  const barW = Math.min(48, slot * 0.55);
  const x = i => padL + i*slot + slot/2;
  const y = v => padT + chartH - (v/100)*chartH;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}} role="img" aria-label="Gráfico de acuracidade mensal">
      {[0,25,50,75,100].map(t=>(
        <g key={t}>
          <line x1={padL} x2={W-padR} y1={y(t)} y2={y(t)} stroke="var(--line)" strokeWidth={1} strokeDasharray="3,3" />
          <text x={padL-8} y={y(t)+3.5} textAnchor="end" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{t}%</text>
        </g>
      ))}
      <line x1={padL} x2={W-padR} y1={y(meta)} y2={y(meta)} stroke={WEEKLY_CHART_COLOR} strokeWidth={1.5} strokeDasharray="5,4" opacity={0.65}>
        <title>Meta: {meta}%</title>
      </line>
      {months.map((m,i)=>(
        <g key={m.key}>
          {m.acuracidade!=null ? (
            <>
              <rect x={x(i)-barW/2} y={y(m.acuracidade)} width={barW} height={Math.max(0, y(0)-y(m.acuracidade))} rx={4} fill={WEEKLY_CHART_COLOR}>
                <title>{m.label} ({m.sublabel}): {m.acuracidade.toFixed(1)}% · {m.total} contagem(ns)</title>
              </rect>
              <text x={x(i)} y={y(m.acuracidade)-8} textAnchor="middle" fontSize={11} fontWeight={700} fill="var(--ink)" fontFamily="var(--font-mono)">{Math.round(m.acuracidade)}%</text>
            </>
          ) : (
            <text x={x(i)} y={y(0)-8} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">0%</text>
          )}
          <text x={x(i)} y={H-24} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{m.label}</text>
          <text x={x(i)} y={H-11} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{m.sublabel}</text>
        </g>
      ))}
    </svg>
  );
}

// Card de KPI (1ª linha, resumo executivo) — grid de 2 colunas × 2 linhas
// (`.kpi-card-content`): ícone (ocupa as 2 linhas) | cabeçalho (título +
// período, linha 1, largura INTEIRA do card) sobre corpo (número/meta +
// coluna secundária, linha 2, só aí divide em 2 colunas). Título/período
// NUNCA dividem espaço horizontal com a coluna secundária — é isso que
// deixa o texto completo caber sem reticência. Altura do card é FIXA
// (178px, ver CSS) — nada aqui pode crescer além dela.
// `meta`/`linhas`/`direitaCustom`/`progresso` são opcionais. `direitaCustom`
// (nó React) substitui as linhas rótulo/valor padrão da coluna secundária —
// usado só pelo card de Divergências (percentual + tendência, formato
// diferente do "rótulo ........ valor" dos outros 3 cards). `progresso`
// (nó React) é a barra de progresso do card de Contagens, empurrada pro
// rodapé do corpo via `justify-content:space-between` do `.kpi-card-body`.
function KpiCard({icon, iconBg, iconColor, titulo, periodo, valor, corValor, meta, linhas, direitaCustom, progresso}){
  return (
    <div className="kpi-card">
      <div className="kpi-card-content">
        <div className="kpi-card-icon" style={{background:iconBg, color:iconColor}}>{icon}</div>
        <div className="kpi-card-header">
          <div className="kpi-card-titulo">{titulo}</div>
          {periodo && <div className="kpi-card-periodo">{periodo}</div>}
        </div>
        <div className="kpi-card-body">
          <div className="kpi-card-body-row">
            <div className="kpi-card-primary">
              <div className="kpi-card-valor" style={corValor ? {color:corValor} : undefined}>{valor}</div>
              {meta!=null && <div className="kpi-card-meta">Meta: {meta}</div>}
            </div>
            <div className="kpi-card-secondary">
              {direitaCustom ? direitaCustom : (linhas||[]).map((l,i)=>(
                <div key={i} className="kpi-card-info-row">
                  <span>{l.rotulo}</span>
                  <span className="v" style={l.cor ? {color:l.cor} : undefined}>{l.valor}</span>
                </div>
              ))}
            </div>
          </div>
          {progresso}
        </div>
      </div>
    </div>
  );
}

function PnlDonut({segments, size=168, strokeWidth=22, centerLabel='inventários'}){
  const r = (size - strokeWidth) / 2;
  const c = 2 * Math.PI * r;
  const total = segments.reduce((s, x) => s + x.value, 0);
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--gray-100)" strokeWidth={strokeWidth} />
      {total > 0 && segments.map((seg, i) => {
        if (seg.value <= 0) return null;
        const len = (seg.value / total) * c;
        const dashoffset = -offset;
        offset += len;
        return (
          <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={seg.color} strokeWidth={strokeWidth}
            strokeDasharray={`${len} ${c - len}`} strokeDashoffset={dashoffset}
            transform={`rotate(-90 ${size/2} ${size/2})`} />
        );
      })}
      <text x="50%" y="47%" textAnchor="middle" fontSize="24" fontWeight="700" fill="var(--navy)" fontFamily="Inter, sans-serif">{total}</text>

function BotaoTelaCheia(){
  const [emTelaCheia, setEmTelaCheia] = useState(!!document.fullscreenElement);

  useEffect(()=>{
    function onChangeFs(){ setEmTelaCheia(!!document.fullscreenElement); }
    document.addEventListener('fullscreenchange', onChangeFs);
    return ()=>document.removeEventListener('fullscreenchange', onChangeFs);
  }, []);

  function alternar(){
    if(document.fullscreenElement){
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen().catch(()=>{
        // Alguns navegadores recusam sem gesto direto do usuário — já
        // estamos dentro de um onClick, então só sobra recusa de
        // ambiente sem suporte (ex.: dentro de um iframe sem permissão),
        // nada a fazer além de deixar como está.
      });
    }
  }

  return (
    <button
      type="button"
      className="pnl-topbar-icon-btn"
      onClick={alternar}
      title={emTelaCheia ? 'Sair da tela cheia' : 'Tela cheia'}
      aria-label={emTelaCheia ? 'Sair da tela cheia' : 'Tela cheia'}
    >
      {/* Silhueta de TV (Lucide "tv") — ícone único, sem texto, pedido do

          title/aria-label mudam) — a mesma TV serve pros dois sentidos. */}

    </button>
  );
}
