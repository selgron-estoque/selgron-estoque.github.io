// Catálogo dos 6 gráficos que o Painel já calcula hoje (nomes/ids internos
// — nunca mostrados na tela, só usados como chave da seleção/ordem salva em
// `painel_indicadores_config`). Ver comentário completo da decisão de
// produto no schema.sql ("PAINEL INDICADORES: CONFIGURAÇÃO..."): isto NÃO é
// um cadastro dinâmico, é só uma seleção/ordem sobre os gráficos que já
// existem — a tela "Indicadores" (index.html) nunca é consultada aqui, nem
// precisa mudar. A ORDEM desta lista é a ordem padrão (mostrar tudo, na
// ordem em que o Painel sempre mostrou).
const INDICADORES_CATALOGO = [
  {id:'acuracidadeSemanal', label:'Acuracidade Semanal (%)'},
  {id:'contagensSemana', label:'Contagens na Semana'},
  {id:'acuracidadeMensal', label:'Acuracidade Mensal (%)'},
  {id:'divergenciaFamilia', label:'Divergência por Família/Grupo (Top 7)'},
  {id:'contadosDivergencias', label:'Contados × Divergências'},
  {id:'itensContadosSemana', label:'Itens Contados na Semana'},
];
const INDICADORES_PADRAO = INDICADORES_CATALOGO.map(c=>c.id);

async function fetchPainelIndicadoresConfig(){
  if(!supabaseClient) return INDICADORES_PADRAO;
  try{
    const { data, error } = await supabaseClient.from('painel_indicadores_config').select('indicadores').eq('id',1).maybeSingle();
    if(error) throw error;
    if(!data || !Array.isArray(data.indicadores)) return INDICADORES_PADRAO;
    // Descarta ids que não existem mais no catálogo (indicador removido do
    // código depois de já ter sido salvo) — nunca deixa uma config antiga
    // quebrar a tela; lista vazia (tudo desmarcado, deliberadamente salvo
    // assim) é respeitada como está, não cai no padrão.
    return data.indicadores.filter(id=>INDICADORES_CATALOGO.some(c=>c.id===id));
  }catch(err){
    console.warn('Painel Indicadores: falha ao buscar configuração de indicadores', err);
    return INDICADORES_PADRAO;
  }
}
async function salvarPainelIndicadoresConfig(ids){
  if(!supabaseClient) return {ok:false, erro:'Supabase não configurado.'};
  try{
    const { error } = await supabaseClient.from('painel_indicadores_config').upsert(
      {id:1, indicadores:ids, atualizado_em:new Date().toISOString()}, {onConflict:'id'}
    );
    if(error) throw error;
    return {ok:true};
  }catch(err){
    return {ok:false, erro:(err && err.message) || 'Não foi possível salvar.'};
  }
}

// Tempo (em segundos) que cada TIPO de tela fica no ar antes de trocar
// sozinha — pedido do cliente: "quero a opção de colocar quanto tempo eu
// quero que rode cada tela". Um valor por TIPO, não por aba individual
// (decisão do cliente): todas as linhas do Tracking Picking usam
// `segundosLinhaTracking`, todo link/arquivo usa `segundosLink`. Os
// DEFAULT abaixo são os mesmos valores que já estavam hardcoded antes desta
// funcionalidade existir — ver comentário completo no schema.sql
// ("PAINEL INDICADORES: TEMPO DE CADA TELA").
const TEMPOS_PADRAO = {segundosIndicadores:60, segundosLinhaTracking:30, segundosLink:60};
async function fetchTemposConfig(){
  if(!supabaseClient) return TEMPOS_PADRAO;
  try{
    const { data, error } = await supabaseClient.from('painel_tempos_config')
      .select('segundos_indicadores, segundos_linha_tracking, segundos_link').eq('id',1).maybeSingle();
    if(error) throw error;
    if(!data) return TEMPOS_PADRAO;
    return {
      segundosIndicadores: data.segundos_indicadores || TEMPOS_PADRAO.segundosIndicadores,
      segundosLinhaTracking: data.segundos_linha_tracking || TEMPOS_PADRAO.segundosLinhaTracking,
      segundosLink: data.segundos_link || TEMPOS_PADRAO.segundosLink,
    };
  }catch(err){
    console.warn('Painel Indicadores: falha ao buscar configuração de tempos', err);
    return TEMPOS_PADRAO;
  }
}
async function salvarTemposConfig(tempos){
  if(!supabaseClient) return {ok:false, erro:'Supabase não configurado.'};
  try{
    const { error } = await supabaseClient.from('painel_tempos_config').upsert({
      id:1,
      segundos_indicadores: tempos.segundosIndicadores,
      segundos_linha_tracking: tempos.segundosLinhaTracking,
      segundos_link: tempos.segundosLink,
      atualizado_em: new Date().toISOString(),
    }, {onConflict:'id'});
    if(error) throw error;
    return {ok:true};
  }catch(err){
    return {ok:false, erro:(err && err.message) || 'Não foi possível salvar.'};
  }
}

// Conteúdo da aba "Indicadores" dentro do modal único "Configurações" (ver
// ConfiguracoesModal) — lista TODO o catálogo (mesmo o que já está
// desmarcado), com checkbox pra incluir/excluir e setas ↑/↓ pra reordenar
// (mesmo padrão de reordenação manual por botão já usado no resto do app,
// ver Programação). A ordem das setas só afeta os itens MARCADOS — os
// desmarcados ficam ancorados no fim da lista visual, fora da reordenação,
// já que sua posição não importa enquanto ficarem de fora do Painel.
// Sem portal/backdrop/header própria — isso tudo é da ConfiguracoesModal,
// que é quem monta/desmonta esta aba (não precisa de `open`/`onClose`
// aqui).
function ConteudoConfigIndicadores({ordemAtual, onSalvo}){
  const [ordem, setOrdem] = useState(ordemAtual);
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState(null);

  useEffect(()=>{ setOrdem(ordemAtual); }, [ordemAtual]);

  const marcados = ordem;
  const desmarcados = INDICADORES_CATALOGO.map(c=>c.id).filter(id=>!ordem.includes(id));
  const labelDe = id => (INDICADORES_CATALOGO.find(c=>c.id===id)||{}).label || id;

  function alternar(id, marcar){
    setOrdem(prev => marcar ? [...prev, id] : prev.filter(x=>x!==id));
  }
  function mover(id, direcao){
    setOrdem(prev=>{
      const idx = prev.indexOf(id);
      const alvo = direcao==='up' ? idx-1 : idx+1;
      if(idx===-1 || alvo<0 || alvo>=prev.length) return prev;
      const nova = [...prev];
      [nova[idx], nova[alvo]] = [nova[alvo], nova[idx]];
      return nova;
    });
  }
  async function handleSalvar(){
    setSalvando(true);
    setErro(null);
    const res = await salvarPainelIndicadoresConfig(ordem);
    setSalvando(false);
    if(!res.ok){ setErro(res.erro); return; }
    onSalvo(ordem);
  }

  return (
    <div>
      <div className="modal-subtitle" style={{marginBottom:14}}>Marque quais gráficos aparecem no Painel e use as setas pra escolher a ordem.</div>

      {marcados.map((id,i)=>(
        <div key={id} className="pnl-cfg-item">
          <label>
            <input type="checkbox" checked={true} onChange={()=>alternar(id,false)} />
            {labelDe(id)}
          </label>
          <div className="pnl-cfg-arrows">
            <button type="button" disabled={i===0} onClick={()=>mover(id,'up')} title="Mover pra cima" aria-label="Mover pra cima">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
            </button>
            <button type="button" disabled={i===marcados.length-1} onClick={()=>mover(id,'down')} title="Mover pra baixo" aria-label="Mover pra baixo">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
            </button>
          </div>
        </div>
      ))}
      {desmarcados.map(id=>(
        <div key={id} className="pnl-cfg-item" style={{opacity:.6}}>
          <label>
            <input type="checkbox" checked={false} onChange={()=>alternar(id,true)} />
            {labelDe(id)}
          </label>
        </div>
      ))}

      {erro && <div style={{fontSize:'var(--text-xs)',color:'var(--danger)',margin:'8px 0'}}>{erro}</div>}

      <div style={{display:'flex',gap:10,marginTop:16}}>
        <button type="button" className="pnl-cfg-btn pnl-cfg-btn-primary" onClick={handleSalvar} disabled={salvando}>{salvando ? 'Salvando…' : 'Salvar'}</button>
      </div>
    </div>
  );
}

// Mínimo sensato pra cada tempo — evita alguém salvar "0" ou um valor
// negativo sem querer e a tela ficar trocando descontroladamente rápido
// (ou o setInterval nem funcionar direito com um número inválido).
const TEMPO_MINIMO_SEGUNDOS = 5;

// Conteúdo da aba "Tempo" dentro do modal único "Configurações" (ver
// ConfiguracoesModal) — 3 campos numéricos (segundos). Salvar aqui não
// reinicia nenhum timer em andamento na hora — o valor novo só passa a
// valer na PRÓXIMA vez que aquele timer for recriado (troca de tela, ver
// dependências dos `useEffect`/`setInterval` em App()/TrackingPicking/
// LinkExternoPanel), mesmo comportamento de qualquer outra config já
// editável no Painel enquanto a TV está com outra tela aberta.
function ConteudoConfigTempos({temposAtuais, onSalvo}){
  const [tempos, setTempos] = useState(temposAtuais);
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState(null);

  useEffect(()=>{ setTempos(temposAtuais); }, [temposAtuais]);

  function campo(chave, valor){
    setTempos(prev => ({...prev, [chave]: valor}));
  }
  async function handleSalvar(){
    const valores = [tempos.segundosIndicadores, tempos.segundosLinhaTracking, tempos.segundosLink];
    if(valores.some(v => !Number.isFinite(v) || v < TEMPO_MINIMO_SEGUNDOS)){
      setErro(`Cada tempo precisa ser um número de pelo menos ${TEMPO_MINIMO_SEGUNDOS} segundos.`);
      return;
    }
    setSalvando(true);
    setErro(null);
    const res = await salvarTemposConfig(tempos);
    setSalvando(false);
    if(!res.ok){ setErro(res.erro); return; }
    onSalvo(tempos);
  }

  const campos = [
    {chave:'segundosIndicadores', label:'Indicadores'},
    {chave:'segundosLinhaTracking', label:'Cada linha do Tracking Picking (Elétrica/SEM/SSE/SEP)'},
    {chave:'segundosLink', label:'Cada link/arquivo'},
  ];

  return (
    <div>
      <div className="modal-subtitle" style={{marginBottom:14}}>
        Quanto tempo (em segundos) cada tipo de tela fica no ar antes do rodízio automático trocar sozinho
        pra próxima. Um valor novo só vale a partir da próxima troca — não reinicia o cronômetro em
        andamento na hora de salvar.
      </div>

      {campos.map(c => (
        <div key={c.chave} className="pnl-cfg-item" style={{display:'block'}}>
          <label style={{display:'block',fontSize:'var(--text-xs)',color:'var(--ink-dim)',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.5px'}}>{c.label} (segundos)</label>
          <input
            type="number" min={TEMPO_MINIMO_SEGUNDOS} step="1"
            value={tempos[c.chave]}
            onChange={e=>campo(c.chave, parseInt(e.target.value, 10))}
            style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1px solid var(--line)',background:'var(--panel)',color:'var(--ink)',fontSize:'var(--text-sm)',boxSizing:'border-box'}}
          />
        </div>
      ))}

      {erro && <div style={{fontSize:'var(--text-xs)',color:'var(--danger)',margin:'8px 0'}}>{erro}</div>}

      <div style={{display:'flex',gap:10,marginTop:16}}>
        <button type="button" className="pnl-cfg-btn pnl-cfg-btn-primary" onClick={handleSalvar} disabled={salvando}>{salvando ? 'Salvando…' : 'Salvar'}</button>
      </div>
    </div>
  );
}

// Abas de link externo configuráveis (pedido do cliente: mostrar uma
// planilha do Google Sheets na TV; resolvido de forma genérica, não
// específica de Sheets — qualquer URL que a origem permita exibir dentro
// de um <iframe>). Lista (não mais 1 link só, ver histórico) — ordenada por
// `ordem` — ver comentário completo no schema.sql ("PAINEL INDICADORES:
// ABAS DE LINK EXTERNO").
async function fetchLinksExternos(){
  if(!supabaseClient) return [];
  try{
    const { data, error } = await supabaseClient.from('painel_links_externos').select('id, url, titulo, ordem, tipo').order('ordem', {ascending:true});
    if(error) throw error;
    return data || [];
  }catch(err){
    console.warn('Painel Indicadores: falha ao buscar links externos', err);
    return [];
  }
}
async function criarLinkExterno(url, titulo, ordem){
  if(!supabaseClient) return {ok:false, erro:'Supabase não configurado.'};
  try{
    const { error } = await supabaseClient.from('painel_links_externos').insert({url, titulo: titulo || null, ordem, tipo:'link'});
    if(error) throw error;
    return {ok:true};
  }catch(err){
    return {ok:false, erro:(err && err.message) || 'Não foi possível salvar.'};
  }
}
// Content-Type que cada extensão precisa ir no Storage — NÃO dá pra
// confiar em `file.type` (o que o navegador detecta sozinho ao escolher o
// arquivo): pra .html/.htm ele costuma vir vazio ou genérico dependendo do
// navegador/sistema, e sem Content-Type certo o Storage guarda como
// `application/octet-stream` — o navegador então baixa/mostra o
// CÓDIGO-FONTE em vez de renderizar a página (foi exatamente isso que
// aconteceu: usuário mandou um .html e viu o `<!DOCTYPE html>` na tela em
// vez da página). Mapear pela extensão, sempre, evita esse problema de vez.
const CONTENT_TYPE_ARQUIVO_EXTERNO = {
  html: 'text/html; charset=utf-8',
  htm: 'text/html; charset=utf-8',
  pdf: 'application/pdf',
  jpg: 'image/jpeg',
  jpeg: 'image/jpeg',
  png: 'image/png',
  gif: 'image/gif',
  webp: 'image/webp',
};
// Envia um arquivo (html/pdf/jpg — pedido do cliente) pro bucket público
// `painel-arquivos` (ver schema.sql) e já cria a linha correspondente em
// `painel_links_externos`, com `tipo` inferido pela extensão do arquivo.
// Nome do arquivo no Storage é gerado (timestamp + aleatório), não o nome
// original — evita colisão entre uploads de nomes iguais.
async function enviarArquivoLinkExterno(file, titulo, ordem){
  if(!supabaseClient) return {ok:false, erro:'Supabase não configurado.'};
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const tipo = ext==='pdf' ? 'pdf'
    : (ext==='html' || ext==='htm') ? 'html'
    : (['jpg','jpeg','png','gif','webp'].includes(ext)) ? 'imagem'
    : null;
  if(!tipo) return {ok:false, erro:'Formato não suportado. Envie um arquivo .html, .pdf, .jpg/.jpeg/.png.'};
  try{
    const caminho = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const { error: erroUpload } = await supabaseClient.storage.from('painel-arquivos').upload(caminho, file, {contentType: CONTENT_TYPE_ARQUIVO_EXTERNO[ext]});
    if(erroUpload) throw erroUpload;
    const { data: urlData } = supabaseClient.storage.from('painel-arquivos').getPublicUrl(caminho);
    const { error } = await supabaseClient.from('painel_links_externos').insert({url: urlData.publicUrl, titulo: titulo || null, ordem, tipo});
    if(error) throw error;
    return {ok:true};
  }catch(err){
    return {ok:false, erro:(err && err.message) || 'Não foi possível enviar o arquivo.'};
  }
}
async function atualizarLinkExterno(id, url, titulo){
  if(!supabaseClient) return {ok:false, erro:'Supabase não configurado.'};
  try{
    const { error } = await supabaseClient.from('painel_links_externos').update({url, titulo: titulo || null}).eq('id', id);
    if(error) throw error;
    return {ok:true};
  }catch(err){
    return {ok:false, erro:(err && err.message) || 'Não foi possível salvar.'};
  }
}
async function removerLinkExterno(id){
  if(!supabaseClient) return {ok:false, erro:'Supabase não configurado.'};
  try{
    const { error } = await supabaseClient.from('painel_links_externos').delete().eq('id', id);
    if(error) throw error;
    return {ok:true};
  }catch(err){
    return {ok:false, erro:(err && err.message) || 'Não foi possível remover.'};
  }
}
// Reordena em lote — recebe os ids JÁ na nova ordem e grava o índice de cada
// um como `ordem` (0, 1, 2...). Várias chamadas de update em paralelo (não
// uma tabela grande, não compensa complicar com upsert em lote).
async function salvarOrdemLinksExternos(idsEmOrdem){
  if(!supabaseClient) return {ok:false, erro:'Supabase não configurado.'};
  try{
    const resultados = await Promise.all(idsEmOrdem.map((id, i) =>
      supabaseClient.from('painel_links_externos').update({ordem: i}).eq('id', id)
    ));
    const comErro = resultados.find(r => r.error);
    if(comErro) throw comErro.error;
    return {ok:true};
  }catch(err){
    return {ok:false, erro:(err && err.message) || 'Não foi possível reordenar.'};
  }
}

// Conteúdo da aba "Link" dentro do modal único "Configurações" (ver
// ConfiguracoesModal) — lista (adicionar, editar, remover, reordenar) de
// links/arquivos externos, pedido do cliente depois da 1ª versão (que só
// aceitava 1 link): "consigo criar mais abas com outros links?" e depois
// "quero também opção de mandar arquivo html, pdf, jpg". Sem nenhum
// link/arquivo cadastrado, as abas de link somem do rodízio (ver `temLink`
// em `PanelTabs`/`App()`) — sem precisar de um checkbox separado, é só a
// lista ficar vazia.
//
// 2 formas de adicionar (alternadas por `modo`, só aparece a escolha ao
// ADICIONAR — editar um item já existente só mexe no título, nunca troca de
// link pra arquivo nem reenvia um arquivo novo; pra isso, remove e adiciona
// de novo): colar uma URL (`modo==='link'`, comportamento original) ou
// enviar um arquivo (`modo==='arquivo'`, sobe pro Storage via
// `enviarArquivoLinkExterno` — ver ali o porquê do `tipo` inferido pela
// extensão).
function ConteudoConfigLink({links, onCriar, onAtualizar, onRemover, onReordenar, onEnviarArquivo}){
  const [editandoId, setEditandoId] = useState(null); // null = formulário é "adicionar novo"
  const [modo, setModo] = useState('link'); // 'link' | 'arquivo' — só usado ao adicionar
  const [url, setUrl] = useState('');
  const [titulo, setTitulo] = useState('');
  const [arquivo, setArquivo] = useState(null);
  const [salvando, setSalvando] = useState(false);
  const [removendoId, setRemovendoId] = useState(null);
  const [erro, setErro] = useState(null);

  function iniciarEdicao(link){
    setEditandoId(link.id);
    setModo('link');
    setUrl(link.url);
    setTitulo(link.titulo || '');
    setArquivo(null);
    setErro(null);
  }
  function cancelarEdicao(){
    setEditandoId(null);
    setModo('link');
    setUrl('');
    setTitulo('');
    setArquivo(null);
    setErro(null);
  }
  function mover(id, direcao){
    const idx = links.findIndex(l=>l.id===id);
    const alvo = direcao==='up' ? idx-1 : idx+1;
    if(idx===-1 || alvo<0 || alvo>=links.length) return;
    const nova = [...links];
    [nova[idx], nova[alvo]] = [nova[alvo], nova[idx]];
    onReordenar(nova.map(l=>l.id));
  }
  // Editando um item que foi ENVIADO como arquivo (não colado como link) —
  // só o título é editável (o campo de URL nem aparece, ver JSX abaixo).
  const editandoArquivo = editandoId && (links.find(l=>l.id===editandoId) || {}).tipo !== 'link';

  async function handleSalvar(){
    if(editandoArquivo){
      setSalvando(true);
      setErro(null);
      const res = await onAtualizar(editandoId, url, titulo.trim());
      setSalvando(false);
      if(!res.ok){ setErro(res.erro); return; }
      cancelarEdicao();
      return;
    }
    if(!editandoId && modo==='arquivo'){
      if(!arquivo){ setErro('Escolha um arquivo.'); return; }
      setSalvando(true);
      setErro(null);
      const res = await onEnviarArquivo(arquivo, titulo.trim(), links.length);
      setSalvando(false);
      if(!res.ok){ setErro(res.erro); return; }
      cancelarEdicao();
      return;
    }
    const urlLimpa = url.trim();
    if(!urlLimpa){
      setErro('Cole um link.');
      return;
    }
    if(!/^https?:\/\//i.test(urlLimpa)){
      setErro('O link precisa começar com http:// ou https://');
      return;
    }
    setSalvando(true);
    setErro(null);
    const res = editandoId
      ? await onAtualizar(editandoId, urlLimpa, titulo.trim())
      : await onCriar(urlLimpa, titulo.trim(), links.length);
    setSalvando(false);
    if(!res.ok){ setErro(res.erro); return; }
    cancelarEdicao();
  }
  async function handleRemover(id){
    setRemovendoId(id);
    await onRemover(id);
    setRemovendoId(null);
  }

  const rotuloTipo = {link:null, html:'HTML', pdf:'PDF', imagem:'IMAGEM'};

  return (
    <div>
      <div className="modal-subtitle" style={{marginBottom:14}}>
        Cada um vira uma aba própria, no mesmo rodízio automático da TV e na navegação por controle (60s
        cada). Um link colado precisa ser de uma origem que permita exibir dentro de outra página (ex.:
        Google Sheets "Publicado na Web", aba "Inserir") — links normais de edição/visualização geralmente
        são bloqueados pela própria origem e a aba aparece em branco. Um arquivo enviado (HTML, PDF ou
        imagem) não tem esse problema.
      </div>

        {links.map((l,i)=>(
          <div key={l.id} className="pnl-cfg-item">
            <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:2}}>
              <div style={{fontSize:'var(--text-sm)',color:'var(--ink)',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:8}}>
                {l.titulo || `Link ${i+1}`}
                {rotuloTipo[l.tipo] && <span className="chart-meta-badge">{rotuloTipo[l.tipo]}</span>}
              </div>
              <div style={{fontSize:'var(--text-xs)',color:'var(--ink-dim)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.url}</div>
            </div>
            <div className="pnl-cfg-arrows">
              <button type="button" disabled={i===0} onClick={()=>mover(l.id,'up')} title="Mover pra cima" aria-label="Mover pra cima">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
              </button>
              <button type="button" disabled={i===links.length-1} onClick={()=>mover(l.id,'down')} title="Mover pra baixo" aria-label="Mover pra baixo">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
              </button>
              <button type="button" onClick={()=>iniciarEdicao(l)} title="Editar" aria-label="Editar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
              </button>
              <button type="button" disabled={removendoId===l.id} onClick={()=>handleRemover(l.id)} title="Remover" aria-label="Remover">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
              </button>
            </div>
          </div>
        ))}

        <div style={{fontSize:'var(--text-xs)',color:'var(--ink-dim)',textTransform:'uppercase',letterSpacing:'0.5px',margin:'12px 0 10px'}}>
          {editandoId ? 'Editar' : 'Adicionar'}
        </div>

        {!editandoId && (
          <div style={{display:'flex',gap:8,marginBottom:12}}>
            <button
              type="button"
              className={'panel-tab-btn' + (modo==='link' ? ' active' : '')}
              style={{padding:'8px 16px',fontSize:'var(--text-sm)',flex:1}}
              onClick={()=>{ setModo('link'); setErro(null); }}
            >Colar link</button>
            <button
              type="button"
              className={'panel-tab-btn' + (modo==='arquivo' ? ' active' : '')}
              style={{padding:'8px 16px',fontSize:'var(--text-sm)',flex:1}}
              onClick={()=>{ setModo('arquivo'); setErro(null); }}
            >Enviar arquivo</button>
          </div>
        )}

        {editandoArquivo ? (
          <div style={{fontSize:'var(--text-xs)',color:'var(--ink-dim)',margin:'0 0 12px'}}>
            Este item foi enviado como arquivo — só dá pra trocar o título aqui. Pra trocar o arquivo, remova
            este item e envie o novo.
          </div>
        ) : (!editandoId && modo==='arquivo') ? (
          <div className="pnl-cfg-item" style={{display:'block'}}>
            <label style={{display:'block',fontSize:'var(--text-xs)',color:'var(--ink-dim)',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.5px'}}>Arquivo (.html, .pdf, .jpg/.jpeg/.png)</label>
            <input
              type="file" accept=".html,.htm,.pdf,.jpg,.jpeg,.png,.gif,.webp"
              onChange={e=>setArquivo(e.target.files && e.target.files[0] ? e.target.files[0] : null)}
              style={{width:'100%',fontSize:'var(--text-sm)',color:'var(--ink)'}}
            />
          </div>
        ) : (
          <div className="pnl-cfg-item" style={{display:'block'}}>
            <label style={{display:'block',fontSize:'var(--text-xs)',color:'var(--ink-dim)',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.5px'}}>Link (URL)</label>
            <input
              type="text" value={url} onChange={e=>setUrl(e.target.value)}
              placeholder="https://docs.google.com/spreadsheets/d/e/.../pubhtml"
              style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1px solid var(--line)',background:'var(--panel)',color:'var(--ink)',fontSize:'var(--text-sm)',boxSizing:'border-box'}}
            />
          </div>
        )}
        <div className="pnl-cfg-item" style={{display:'block'}}>
          <label style={{display:'block',fontSize:'var(--text-xs)',color:'var(--ink-dim)',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.5px'}}>Título da aba (opcional)</label>
          <input
            type="text" value={titulo} onChange={e=>setTitulo(e.target.value)}
            placeholder="Ex: Planilha"
            style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1px solid var(--line)',background:'var(--panel)',color:'var(--ink)',fontSize:'var(--text-sm)',boxSizing:'border-box'}}
          />
        </div>

      {erro && <div style={{fontSize:'var(--text-xs)',color:'var(--danger)',margin:'8px 0'}}>{erro}</div>}

      <div style={{display:'flex',gap:10,marginTop:16}}>
        {editandoId && <button type="button" className="pnl-cfg-btn pnl-cfg-btn-outline" onClick={cancelarEdicao} disabled={salvando}>Cancelar edição</button>}
        <button type="button" className="pnl-cfg-btn pnl-cfg-btn-primary" onClick={handleSalvar} disabled={salvando}>
          {salvando ? (modo==='arquivo' && !editandoId ? 'Enviando…' : 'Salvando…') : (editandoId ? 'Salvar edição' : (modo==='arquivo' ? 'Enviar arquivo' : 'Adicionar link'))}
        </button>
      </div>
    </div>
  );
}

// Modal único de "Configurações" — pedido do cliente: em vez de 3 botões
// separados no cabeçalho (indicadores/link/tempo), UM botão só, que abre
// isto aqui: um seletor de aba SÓ COM ÍCONE (indicadores/link/tempo,
// mesmos 3 ícones que os botões antigos usavam) e, embaixo, o conteúdo da
// aba escolhida (`ConteudoConfigIndicadores`/`ConteudoConfigLink`/
// `ConteudoConfigTempos` — cada um só o MIOLO, sem portal/backdrop/header
// próprios, que agora são só daqui). Diferente das versões antigas (que
// fechavam o modal inteiro ao salvar), salvar uma aba aqui NÃO fecha o
// modal — só faz sentido continuar aberto já que dá pra configurar mais de
// uma coisa na mesma visita (ex.: mexer no link e depois no tempo, sem
// precisar reabrir).
function ConfiguracoesModal({
  open, onClose,
  ordemIndicadores, onSalvarIndicadores,
  links, onCriarLink, onAtualizarLink, onRemoverLink, onReordenarLink, onEnviarArquivoLink,
  temposAtuais, onSalvarTempos,
}){
  const [abaInterna, setAbaInterna] = useState('indicadores');
  useEffect(()=>{ if(open) setAbaInterna('indicadores'); }, [open]);

  if(!open) return null;

  const abas = [
    {
      id: 'indicadores', title: 'Indicadores',
      icon: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c0 .69.4 1.32 1.04 1.6.2.08.4.13.6.15H21a2 2 0 1 1 0 4h-.09c-.69 0-1.32.4-1.6 1.04Z"/></>,
    },
    {
      id: 'link', title: 'Link',
      icon: <><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></>,
    },
    {
      id: 'tempo', title: 'Tempo',
      icon: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
    },
  ];

  return ReactDOM.createPortal((
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <div className="modal-title">Configurações</div>
          <button type="button" className="modal-close-btn" onClick={onClose} aria-label="Fechar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        <div style={{display:'flex',gap:8,marginBottom:18}}>
          {abas.map(a=>(
            <button
              key={a.id} type="button"
              className={'panel-tab-btn' + (abaInterna===a.id ? ' active' : '')}
              title={a.title} aria-label={a.title}
              style={{padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'center'}}
              onClick={()=>setAbaInterna(a.id)}
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{a.icon}</svg>
            </button>
          ))}
        </div>

        {abaInterna==='indicadores' && <ConteudoConfigIndicadores ordemAtual={ordemIndicadores} onSalvo={onSalvarIndicadores} />}
        {abaInterna==='link' && (
          <ConteudoConfigLink
            links={links}
            onCriar={onCriarLink} onAtualizar={onAtualizarLink} onRemover={onRemoverLink}
            onReordenar={onReordenarLink} onEnviarArquivo={onEnviarArquivoLink}
          />
        )}
        {abaInterna==='tempo' && <ConteudoConfigTempos temposAtuais={temposAtuais} onSalvo={onSalvarTempos} />}
      </div>
    </div>
  ), document.body);
}

// Tela das abas de link — <iframe> do link atual + (quando há mais de 1) uma
// fileira de sub-abas pra escolher direto, mesmo padrão visual/estrutural
// dos botões Elétrica/SEM/SSE/SEP dentro de Tracking Picking (aqui ainda
// `.panel-tab-btn` — só os botões DENTRO do Tracking Picking passaram a usar
// `.tp-pill`, redesign visual daquela tela específica).
// Ciclo automático (60s por link, própria dessa tela) segue o MESMO padrão
// já usado por TrackingPicking pro ciclo de linhas (ver comentário lá):
// ref pra sempre ler o índice mais atual dentro do setInterval, e as 2
// chamadas (mudar link / avisar que fechou o ciclo) como statements DIRETOS
// e sequenciais — nunca uma aninhada dentro do updater da outra (mesmo bug
// de "atualizar um componente enquanto renderiza outro" já corrigido antes).
function LinkExternoPanel({tela, onChange, theme, onToggleTheme, onAbrirConfig, onSelecionarLink, onNavegarEsquerda, onNavegarDireita, onCicloCompleto, links, linkIndex, onChangeLinkIndex, segundosLink}){
  const linkIndexRef = useRef(linkIndex);
  useEffect(() => { linkIndexRef.current = linkIndex; }, [linkIndex]);

  useEffect(() => {
    if(links.length === 0) return;
    const id = setInterval(() => {
      const proximoIdx = linkIndexRef.current + 1;
      if(proximoIdx >= links.length){
        onChangeLinkIndex(0);
        if(onCicloCompleto) onCicloCompleto();
      } else {
        onChangeLinkIndex(proximoIdx);
      }
    }, segundosLink*1000);
    return () => clearInterval(id);
  }, [links.length, onCicloCompleto, onChangeLinkIndex, segundosLink]);

  const linkAtual = links[linkIndex] || links[0] || null;

  // Arquivo HTML enviado (tipo==='html') — NÃO usa <iframe src=...> direto.
  // O Storage do Supabase se recusa a servir esse arquivo com
  // `Content-Type: text/html` no link público (proteção deles contra
  // hospedar página maliciosa sob o domínio supabase.co) — o navegador
  // então mostra o código-fonte em vez de renderizar, mesmo com o upload
  // pedindo o Content-Type certo (`CONTENT_TYPE_ARQUIVO_EXTERNO`, ver
  // `enviarArquivoLinkExterno`; aquilo sozinho não resolve). Contorno: busca
  // o HTML como TEXTO (`fetch` + `.text()`, o Content-Type do download não
  // importa pra isso) e injeta no iframe via `srcDoc` — um iframe com
  // `srcDoc` sempre renderiza a string como HTML, não depende de header
  // nenhum vindo de lugar nenhum.
  const [htmlConteudo, setHtmlConteudo] = useState(null);
  const [htmlErro, setHtmlErro] = useState(false);
  useEffect(() => {
    if(!linkAtual || linkAtual.tipo!=='html'){ setHtmlConteudo(null); setHtmlErro(false); return; }
    let cancelado = false;
    setHtmlConteudo(null);
    setHtmlErro(false);
    fetch(linkAtual.url)
      .then(res => { if(!res.ok) throw new Error('status '+res.status); return res.text(); })
      .then(texto => { if(!cancelado) setHtmlConteudo(texto); })
      .catch(() => { if(!cancelado) setHtmlErro(true); });
    return () => { cancelado = true; };
  }, [linkAtual && linkAtual.id, linkAtual && linkAtual.tipo]);

  return (
    <div>
      <PanelTabs tela={tela} onChange={onChange} onAbrirConfig={onAbrirConfig} links={links} linkIndex={linkIndex} onSelecionarLink={onSelecionarLink} onNavegarEsquerda={onNavegarEsquerda} onNavegarDireita={onNavegarDireita} theme={theme} onToggleTheme={onToggleTheme} />
      {linkAtual ? (
        <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 56px)'}}>
          {linkAtual.tipo==='imagem' ? (
            <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',background:'#000'}}>
              <img
                src={linkAtual.url}
                alt={linkAtual.titulo || 'Imagem'}
                style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain'}}
              />
            </div>
          ) : linkAtual.tipo==='html' ? (
            htmlErro ? (
              <div className="content"><div className="demo-banner">Não foi possível carregar esse arquivo.</div></div>
            ) : htmlConteudo==null ? (
              <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-dim)'}}>Carregando…</div>
            ) : (
              <iframe
                srcDoc={htmlConteudo}
                title={linkAtual.titulo || 'Link externo'}
                style={{display:'block',width:'100%',flex:1,border:'none'}}
              />
            )
          ) : (
            <iframe
              src={linkAtual.url}
              title={linkAtual.titulo || 'Link externo'}
              style={{display:'block',width:'100%',flex:1,border:'none'}}
            />
          )}
        </div>
      ) : (
        <div className="content">
          <div className="demo-banner">Nenhum link configurado. Clique no ícone de link, ao lado das abas, pra colar um.</div>
        </div>
      )}
    </div>
  );
}

function PainelIndicadores({tela, onChange, theme, onToggleTheme, onAbrirConfig, links, linkIndex, onSelecionarLink, onNavegarEsquerda, onNavegarDireita, ordemVisivel, status, counts, historico, inventariosData}){
  // Busca de dado (status/counts/historico/inventariosData) e o polling de
  // 5 min + Realtime AGORA vivem em App() (lifted pra lá, mesmo padrão de
  // `ordemVisivel` logo abaixo) — chegam aqui como PROPS. Motivo: antes,
  // esse `useEffect` rodava só enquanto este componente estava MONTADO, e
  // o rodízio automático de telas desmonta este painel toda vez que troca
  // pra "Pedidos de Compra"/"Tracking Picking" — ou seja, todo dado
  // carregado se perdia e a tela recomeçava do zero (mostrando o exemplo
  // de novo) TODA VEZ que o rodízio voltava pra cá, não só na 1ª vez que a
  // TV ligava. Com o dado vivendo em App(), ele continua sendo atualizado
  // em segundo plano mesmo com esta tela escondida, e a troca de aba fica
  // instantânea (ver comentário completo em App()).

  // Configuração de quais indicadores aparecem/em que ordem — `ordemVisivel`
  // agora é PROP, vindo de App() (lifted pra lá porque o botão único de
  // Configurações, com a aba "Indicadores" dentro, precisa poder abrir de
  // QUALQUER tela agora, não só desta — ver comentário completo em App()).

  const dadosAoVivo = status==='ok';

  const calc = useMemo(()=>{
    if(!dadosAoVivo) return null;
    const hojeStr = hojeLocalStr();
    const {from: dataInicioStr, to: dataFimStr} = computeTrendRangeFixo(hojeStr);
    const poolTendencia = buildPoolTendencia(counts, historico);
    const poolTendenciaDedup = ultimaContagemPorDocumento(poolTendencia);

    const weeklyStats = computeWeeklyStats(poolTendencia, dataInicioStr, dataFimStr);
    const weeklyStatsItensUnicos = computeWeeklyStats(poolTendenciaDedup, dataInicioStr, dataFimStr);

    const anoAtualStr = String(new Date().getFullYear()) + '-01-01';
    const monthlyStats = computeMonthlyStats(poolTendencia, anoAtualStr, hojeStr);

    const poolTendenciaNoPeriodo = poolTendenciaDedup.filter(c=>c.data && c.data>=dataInicioStr && c.data<=dataFimStr);
    const pizzaTotalContado = poolTendenciaNoPeriodo.length;
    const pizzaDivergentes = poolTendenciaNoPeriodo.filter(c=>c.diferenca!==0 && c.diferenca!==null).length;
    const pizzaSemDivergencia = pizzaTotalContado - pizzaDivergentes;

    // Família/Grupo só existe em contagem AO VIVO (não em histórico
    // importado) — mesmo critério de index.html, ver comentário original
    // perto de `porFamiliaObj` em Dashboard.
    const todasParaQualidade = ultimaContagemPorDocumento(counts);
    const divergentes = todasParaQualidade.filter(c=>c.diferenca!==0 && c.diferenca!==null);
    const divergentesNoPeriodo = divergentes.filter(c=>c.data && c.data>=dataInicioStr && c.data<=dataFimStr);
    const porFamiliaObj = {};
    divergentesNoPeriodo.forEach(c=>{ if(c.familia) porFamiliaObj[c.familia] = (porFamiliaObj[c.familia]||0)+1; });
    const porFamilia = Object.entries(porFamiliaObj).sort((a,b)=>b[1]-a[1]).slice(0,7);

    // ---- 1ª linha de KPIs (cards novos, resumo executivo) ----
    // "Semana atual" (segunda a domingo de hoje) — escopo dos 3 primeiros
    // cards, sempre a partir do MESMO pool deduplicado (1 linha por item)
    // já usado acima em `todasParaQualidade` (item contado mais de uma vez
    // na semana conta 1 vez só, pelo estado mais recente dele).
    const semanaAtualInicio = getWeekInfo(hojeStr).key;
    const fimSemanaAtualDate = new Date(semanaAtualInicio+'T00:00:00'); fimSemanaAtualDate.setDate(fimSemanaAtualDate.getDate()+6);
    const semanaAtualFim = localDateStr(fimSemanaAtualDate);
    const inicioSemanaAnteriorDate = new Date(semanaAtualInicio+'T00:00:00'); inicioSemanaAnteriorDate.setDate(inicioSemanaAnteriorDate.getDate()-7);
    const semanaAnteriorInicio = localDateStr(inicioSemanaAnteriorDate);
    const fimSemanaAnteriorDate = new Date(semanaAtualInicio+'T00:00:00'); fimSemanaAnteriorDate.setDate(fimSemanaAnteriorDate.getDate()-1);
    const semanaAnteriorFim = localDateStr(fimSemanaAnteriorDate);

    const poolSemanaAtual = todasParaQualidade.filter(c=>c.data && c.data>=semanaAtualInicio && c.data<=semanaAtualFim);
    const poolSemanaAnterior = todasParaQualidade.filter(c=>c.data && c.data>=semanaAnteriorInicio && c.data<=semanaAnteriorFim);

    const kpiItensAvaliados = poolSemanaAtual.length;
    const kpiDivergentes = poolSemanaAtual.filter(c=>c.diferenca!==0 && c.diferenca!=null).length;
    const kpiCorretos = kpiItensAvaliados - kpiDivergentes;
    const kpiAcuracidade = kpiItensAvaliados>0 ? (kpiCorretos/kpiItensAvaliados)*100 : null;

    const kpiDivergentesSemanaAnterior = poolSemanaAnterior.filter(c=>c.diferenca!==0 && c.diferenca!=null).length;
    const kpiDivergenciaVariacaoPercent = kpiDivergentesSemanaAnterior>0
      ? ((kpiDivergentes - kpiDivergentesSemanaAnterior)/kpiDivergentesSemanaAnterior)*100
      : null;

    // Acuracidade da semana ANTERIOR — só pra tendência (▲/▼ p.p.) do card
    // de KPI "Acuracidade" (seção 12 do pedido do cliente). Mesmo critério
    // de `kpiAcuracidade` acima, só que sobre `poolSemanaAnterior`.
    const kpiItensAvaliadosAnterior = poolSemanaAnterior.length;
    const kpiCorretosAnterior = kpiItensAvaliadosAnterior - kpiDivergentesSemanaAnterior;
    const kpiAcuracidadeSemanaAnterior = kpiItensAvaliadosAnterior>0 ? (kpiCorretosAnterior/kpiItensAvaliadosAnterior)*100 : null;

    // "Mês atual" (1º dia do mês até o último) — escopo só do card
    // "Acuracidade (itens recontados)" (pedido do cliente: esse card
    // mostra o mês corrente, não a semana — os outros 2 cards desta linha
    // continuam por semana, usando `poolSemanaAtual`/`kpiItensAvaliados`/
    // `kpiDivergentes` acima, sem mudança nenhuma). Mesmo pool
    // deduplicado (`todasParaQualidade`) usado em todos os cards.
    const dataHojeObj = new Date(hojeStr+'T00:00:00');
    const mesAtualInicio = hojeStr.slice(0,7)+'-01';
    const mesAtualFimDate = new Date(dataHojeObj.getFullYear(), dataHojeObj.getMonth()+1, 0);
    const mesAtualFim = localDateStr(mesAtualFimDate);
    const poolMesAtual = todasParaQualidade.filter(c=>c.data && c.data>=mesAtualInicio && c.data<=mesAtualFim);
    const kpiItensAvaliadosMes = poolMesAtual.length;
    const kpiDivergentesMes = poolMesAtual.filter(c=>c.diferenca!==0 && c.diferenca!=null).length;
    const kpiCorretosMes = kpiItensAvaliadosMes - kpiDivergentesMes;
    const kpiAcuracidadeMes = kpiItensAvaliadosMes>0 ? (kpiCorretosMes/kpiItensAvaliadosMes)*100 : null;

    const diasSemanaAtual = computeDiasSemanaAtual(poolSemanaAtual, semanaAtualInicio);
    const diasComContagem = diasSemanaAtual.filter(d=>d.total>0);
    const kpiMediaDiaria = kpiItensAvaliados / 7;
    const kpiMaiorDia = diasComContagem.length ? Math.max(...diasComContagem.map(d=>d.total)) : 0;
    const kpiMenorDia = diasComContagem.length ? Math.min(...diasComContagem.map(d=>d.total)) : 0;

    // "Cobertura da Programação" — carga de trabalho ATUAL (inventários não
    // cancelados), sem recorte de semana (ver `fetchInventariosParaPainel`).
    const coberturaProgramado = inventariosData.reduce((soma,inv)=>soma+inv.qtdItens, 0);
    const coberturaContado = inventariosData.reduce((soma,inv)=>soma+Math.min(inv.contados, inv.qtdItens), 0);
    const coberturaPendente = Math.max(0, coberturaProgramado - coberturaContado);
    const coberturaPercent = coberturaProgramado>0 ? (coberturaContado/coberturaProgramado)*100 : null;

    // 2º card de KPI: "mesmo cálculo da aba Acuracidade" (pedido do
    // cliente) — `computeAcuracidadeItensRecorrentes`, mesma fórmula
    // "Itens Recorrentes" da página Acuracidade (index.html). Pool
    // DEDICADO (`buildPoolItensRecorrentes`, não `poolTendenciaDedup` —
    // ver comentário completo perto da função) pra bater exatamente com
    // `todasParaQualidade` da aba real: histórico só concluído + exclui
    // contagem ainda pendente de decisão.
    const poolItensRecorrentes = buildPoolItensRecorrentes(counts, historico);
    const acuracidadeRecorrentes = computeAcuracidadeItensRecorrentes(poolItensRecorrentes, anoAtualStr, hojeStr);
    const mesAtualKey = getMonthInfo(hojeStr).key;
    const statsRecorrentesMesAtual = acuracidadeRecorrentes.monthlyStats.find(m=>m.key===mesAtualKey) || null;
    const recorrentesElegiveisMesAtual = acuracidadeRecorrentes.elegiveis.filter(c=>c.data && getMonthInfo(c.data).key===mesAtualKey);
    const recorrentesAvaliadosMes = statsRecorrentesMesAtual ? statsRecorrentesMesAtual.total : 0;
    // Mesmo critério EXATO do drill-down "Itens Acurados × Divergentes"
    // (AcuracidadeMesDetalheModal, index.html) — 3 categorias, nunca 2:
    // acurado (diferenca===0), divergente (diferenca!=null e ≠0) e "sem
    // dado" (diferenca==null, fica de fora dos dois). Bug real corrigido
    // aqui: a versão anterior fazia `corretos = avaliados - divergentes`,
    // o que jogava qualquer item "sem dado" pra dentro de "corretos"
    // silenciosamente — sem bater com o drill-down real (que conta os 3
    // separados) sempre que existisse pelo menos 1 item sem dado no mês.
    const recorrentesCorretosMes = recorrentesElegiveisMesAtual.filter(c=>c.diferenca===0).length;
    const recorrentesDivergentesMes = recorrentesElegiveisMesAtual.filter(c=>c.diferenca!==0 && c.diferenca!=null).length;
    const recorrentesAcuracidadeMes = statsRecorrentesMesAtual ? statsRecorrentesMesAtual.acuracidade : null;

    return {
      dataInicioStr, dataFimStr, weeklyStats, weeklyStatsItensUnicos, monthlyStats,
      pizzaTotalContado, pizzaDivergentes, pizzaSemDivergencia, porFamilia,
      semanaAtualInicio, semanaAtualFim,
      kpiItensAvaliados, kpiCorretos, kpiDivergentes, kpiAcuracidade, kpiDivergenciaVariacaoPercent,
      kpiDivergentesSemanaAnterior, kpiAcuracidadeSemanaAnterior,
      kpiItensAvaliadosMes, kpiCorretosMes, kpiDivergentesMes, kpiAcuracidadeMes,
      kpiMediaDiaria, kpiMaiorDia, kpiMenorDia,
      coberturaProgramado, coberturaContado, coberturaPendente, coberturaPercent,
      recorrentesAvaliadosMes, recorrentesCorretosMes, recorrentesDivergentesMes, recorrentesAcuracidadeMes,
    };
  }, [dadosAoVivo, counts, historico, inventariosData]);

  // Estado de carregamento genuíno — mesmo bug (e mesma correção) já
  // aplicada em PedidosCompraPanel, ver comentário completo lá ("Antes,
  // 'loading' caía junto com 'sem-sessao'/'erro' no fallback pros dados de
  // exemplo..."). Sem este early-return, esta aba renderizava com
  // `calc=null` enquanto o login automático da TV + a 1ª consulta real
  // ainda estavam em andamento, mostrando os números de DEMO_KPI por
  // alguns segundos — e trocava de repente pro dado real assim que
  // `status` virasse 'ok', dando a impressão de um "flash" (relatado pelo
  // cliente). Só bail aqui em 'loading', nunca em 'erro'/'sem-sessao' —
  // esses dois continuam mostrando o exemplo + o banner de aviso (mesmo
  // critério de sempre, tela nunca fica "quebrada" numa TV do almoxarifado).
  if(status==='loading'){
    return (
      <div>
        <PanelTabs tela={tela} onChange={onChange} onAbrirConfig={onAbrirConfig} links={links} linkIndex={linkIndex} onSelecionarLink={onSelecionarLink} onNavegarEsquerda={onNavegarEsquerda} onNavegarDireita={onNavegarDireita} theme={theme} onToggleTheme={onToggleTheme} />
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'calc(100vh - 56px)',color:'var(--ink-dim)'}}>Carregando indicadores…</div>
      </div>
    );
  }

  const weeklyStats = calc ? calc.weeklyStats : DEMO_WEEKLY;
  const weeklyStatsItensUnicos = calc ? calc.weeklyStatsItensUnicos : DEMO_WEEKLY_ITENS;
  const monthlyStats = calc ? calc.monthlyStats : DEMO_MONTHLY;
  // Última semana/mês com acuracidade calculada (não necessariamente o
  // último item do array — pode terminar em branco/sem contagem) — só pro
  // resumo no cabeçalho dos gráficos de Acuracidade Semanal/Mensal. `null`
  // quando não há nenhuma semana/mês com dado real ainda (não inventa).
  const ultimaSemanaComDado = [...weeklyStats].reverse().find(w=>w.acuracidade!=null) || null;
  const ultimoMesComDado = [...monthlyStats].reverse().find(m=>m.acuracidade!=null) || null;
  const porFamilia = calc ? calc.porFamilia : DEMO_FAMILIA;
  const maxFamilia = Math.max(1, ...porFamilia.map(([,n])=>n));
  const pizzaTotalContado = calc ? calc.pizzaTotalContado : DEMO_PIZZA.total;
  const pizzaDivergentes = calc ? calc.pizzaDivergentes : DEMO_PIZZA.divergentes;
  const pizzaSemDivergencia = calc ? calc.pizzaSemDivergencia : DEMO_PIZZA.semDivergencia;
  const pizzaSegments = [
    {label:'Sem divergência', value:pizzaSemDivergencia, color:'var(--ok)'},
    {label:'Divergentes', value:pizzaDivergentes, color:'var(--danger)'},
  ];

  // ---- 1ª linha de KPIs (cards novos, resumo executivo) ----
  const semanaAtualInicio = calc ? calc.semanaAtualInicio : DEMO_KPI.semanaAtualInicio;
  const semanaAtualFim = calc ? calc.semanaAtualFim : DEMO_KPI.semanaAtualFim;
  const kpiItensAvaliados = calc ? calc.kpiItensAvaliados : DEMO_KPI.itensAvaliados;
  const kpiCorretos = calc ? calc.kpiCorretos : DEMO_KPI.corretos;
  const kpiDivergentes = calc ? calc.kpiDivergentes : DEMO_KPI.divergentes;

// Ver LINHA_PADRAO/linhaPadraoAtual/LINHAS_PRODUCAO_PADRAO em index.html —
// mesma tabela `linhas_producao` (Supabase), mesmo critério de fallback
// DINÂMICO (nenhuma linha é fixa/protegida, nem "Elétrica" — cliente
// confirmou). A TV só LEITURA aqui — nunca gerencia (adicionar/renomear/
// excluir é só na tela real "Programação", index.html) — ver
// `linhasProducao`/`fetchLinhasProducao` em App().
const LINHA_PADRAO_TRACKING = 'Elétrica'; // só o fallback-do-fallback, se `linhasProducao` vier vazia
const LINHAS_PRODUCAO_TRACKING_PADRAO = ['Elétrica', 'SEM', 'SSE', 'SEP'];
function linhaPadraoAtualTracking(linhasProducao){
  return (linhasProducao && linhasProducao[0] && linhasProducao[0].nome) || LINHA_PADRAO_TRACKING;
}

function linhaProducaoRowToLocalTracking(row){
  return { nome: row.nome, ordem: Number(row.ordem)||0 };
}

async function fetchLinhasProducao(){
  const fallback = LINHAS_PRODUCAO_TRACKING_PADRAO.map((nome,i)=>({nome, ordem:i}));
  if(!supabaseClient) return fallback;
  try{
    const { data, error } = await supabaseClient.from('linhas_producao').select('nome,ordem').order('ordem', {ascending:true});
    if(error) throw error;
    return (data && data.length) ? data.map(linhaProducaoRowToLocalTracking) : fallback;
  }catch(err){
    console.warn('Painel Indicadores: falha ao buscar linhas de produção', err);
    return fallback;
  }
}

// Redesign visual (pedido do cliente) juntou "Atrasada" de volta dentro da
// coluna do status real da máquina — a referência enviada só mostra 4
// colunas/4 cores (Aguardando/Em Separação/Separada/Entregue), sem coluna
// própria pra atraso. `atrasada` continua calculado igual (ver
// `computeMaquinasPainelTracking`) e vira só um destaque no CARD (borda +
// selo, mesma linguagem visual do "Urgente" — ver `MaquinaCardTracking`),
// nunca mais uma coluna separada.
const SEP_KANBAN_COLUNAS_TRACKING = [
  {chave:'aguardando', titulo:'Aguardando Separação', icone:'clock', cor:'--tpcol-aguardando-ink', corBg:'--tpcol-aguardando-bg', vazio:'Nenhuma máquina aguardando.'},

  {chave:'separada', titulo:'Separada', icone:'box', cor:'--tpcol-separada-ink', corBg:'--tpcol-separada-bg', vazio:'Nenhuma máquina separada ainda.'},
  {chave:'entregue', titulo:'Entregue', icone:'checkCircle', cor:'--tpcol-entregue-ink', corBg:'--tpcol-entregue-bg', vazio:'Nenhuma máquina entregue ainda.'},
];

function maquinaEtpRowToLocalTracking(row){
  return {
    etp: row.etp,
    cliente: row.cliente,
    descricao: row.descricao,
    chassi: row.chassi,
    codigoProduto: row.codigo_produto,
    obs: row.obs,
    observacao: row.observacao,
    dataSeparacao: row.data_separacao,
    status: row.status || 'aguardando',
    ordem: (row.ordem===null || row.ordem===undefined) ? null : Number(row.ordem),
    urgente: !!row.urgente,
    linha: row.linha || null,
  };
}
async function fetchMaquinasEtpTracking(){
  if(!supabaseClient) return [];
  try{
    const { data, error } = await supabaseClient.from('maquinas_etp').select('*');
    if(error) throw error;
    return (data||[]).map(maquinaEtpRowToLocalTracking);
  }catch(err){
    console.warn('Tracking Picking: falha ao buscar máquinas (ETP):', err);
    return [];
  }
}
// Select enxuto — só os campos que `computeMaquinasPainelTracking` usa
// (etp/status pro agrupamento e agregação, id só de chave React). `linha`
// adicionada (ver "PROGRAMAÇÃO: MESMA ETP EM VÁRIAS LINHAS" no schema.sql)
// — sem ela, um item não saberia a qual card ele pertence quando a mesma
// ETP tem card em mais de uma linha, e apareceria duplicado nas duas.
async function fetchItensSeparacaoTracking(){
  if(!supabaseClient) return [];
  try{
    const { data, error } = await supabaseClient.from('sequencia_separacao').select('id, etp, status, linha');
    if(error) throw error;
    return data || [];
  }catch(err){
    console.warn('Tracking Picking: falha ao buscar itens de separação:', err);
    return [];
  }
}

// Redesign visual do Tracking Picking: cada card ganhou 2 indicadores novos
// ("COM SALDO"/"SEM SALDO"), consultando AO VIVO a MESMA página que o
// cliente já usa manualmente (https://consulta.selgron.com.br/
// itensfaltantes.php?C2_NTEP=<etp>&...&SALDO=SEM_SALDO|COM_SALDO&
// B1_GRUPO=...) via a Edge Function `consultar-itens-faltantes` — NÃO usa
// `estoque_saldo` (cache local, upload manual): o cliente confirmou que
// essa consulta ao vivo é a fonte certa ("por aqui é mais rápido, seleciona
// a ETP filtra e ele já te traz a quantidade"). A function dispara as 2
// buscas (SEM_SALDO/COM_SALDO) em paralelo pro back-end e devolve só as 2
// CONTAGENS — ver comentário completo em
// supabase/functions/consultar-itens-faltantes/index.ts.
//
// Chamada por ETP (não em lote) — diferente de `fetchSaldoPorCodigosTracking`
// (removida, era o antigo caminho via `estoque_saldo`), aqui cada ETP é 1
// invoke separado, porque a consulta upstream é por ETP. Quem decide QUAIS
// ETPs pedir (só as da linha visível agora, nunca todas as 4 linhas de
// uma vez) é o efeito de busca dentro de `TrackingPicking` — pedir saldo
// ao vivo pra ETPs que nem estão na tela seria desperdiçar tempo/carga na
// consulta Selgron à toa.
async function fetchSaldoPorEtpTracking(etp){
  if(!supabaseClient || !etp) return {ok:false, erro:'Não configurado.'};
  try{
    const { data, error } = await supabaseClient.functions.invoke('consultar-itens-faltantes', {body:{etp}});
    if(error){
      // Mesmo padrão de tratamento de erro de `fetchSaldoConsultaSelgron`
      // (index.html): lê o corpo JSON real do erro via `error.context.json()`
      // quando existe, senão a mensagem genérica do supabase-js não diz
      // nada útil sobre o que a Edge Function realmente respondeu.
      let msg = error.message || 'Falha ao consultar saldo.';
      try{ const corpo = await error.context.json(); if(corpo && corpo.erro) msg = corpo.erro; }catch(_e){ /* sem corpo JSON legível */ }
      return {ok:false, erro:msg};
    }
    if(!data || data.ok!==true) return {ok:false, erro:(data&&data.erro) || 'Falha ao consultar saldo.'};
    return {ok:true, comSaldo:Number(data.comSaldo||0), semSaldo:Number(data.semSaldo||0)};
  }catch(err){
    return {ok:false, erro:String((err&&err.message)||err)};
  }
}

// Bug real reportado pelo cliente (print da tela "SEM", ~18 máquinas de
// uma vez): TODOS os cards ficavam travados em "…" por muito tempo. Causa
// — cada ETP visível dispara 1 `fetchSaldoPorEtpTracking`, e cada uma
// dessas faz 2 requisições upstream na consulta Selgron (SEM_SALDO +
// COM_SALDO) — com 18 ETPs de uma vez, isso é ~36 requisições AO VIVO
// simultâneas batendo no sistema legado da Selgron, que não aguenta essa
// rajada (mesmo problema não aparecia antes, quando a fonte era
// `estoque_saldo`: 1 única consulta em lote no Supabase, não N consultas
// externas). `executarComLimiteDeConcorrencia` processa a lista de ETPs
// em filas de no máximo `LIMITE_CONCORRENCIA_SALDO_TRACKING` por vez —
// cada ETP continua resolvendo de forma INDEPENDENTE assim que termina
// (mesmo comportamento de sempre, card não espera os outros), só o número
// de requisições EM VOO ao mesmo tempo fica limitado. Começou em 3 (valor
// conservador, sem acesso pra medir a capacidade real do sistema da
// Selgron). Testado ao vivo: ~12 máquinas visíveis, 3 de cada vez, levava
// uns 20s pra preencher tudo. Subiu pra 6 (12 requisições upstream
// simultâneas, no máximo — ainda bem abaixo das ~36 do bug original com
// 18 ETPs de uma vez) pra reduzir o tempo total; se ainda estiver lento
// ou o sistema da Selgron não aguentar, pode ajustar de novo.
const LIMITE_CONCORRENCIA_SALDO_TRACKING = 6;
function executarComLimiteDeConcorrencia(tarefas, limite){
  return new Promise(resolve => {
    if(tarefas.length===0){ resolve(); return; }
    let proximaIdx = 0, emAndamento = 0, concluidas = 0;
    function dispararProximas(){
      while(emAndamento<limite && proximaIdx<tarefas.length){
        const tarefa = tarefas[proximaIdx++];
        emAndamento++;
        tarefa().finally(() => {
          emAndamento--; concluidas++;
          if(concluidas===tarefas.length) resolve();
          else dispararProximas();
        });
      }
    }
    dispararProximas();
  });
}

// Mesma regra de agregação de `statusAgregadoMaquina` (index.html) — ver lá
// o comentário completo da decisão de produto.
function statusAgregadoMaquinaTracking(itensDaMaquina){
  const total = itensDaMaquina.length;
  if(total===0) return 'aguardando';
  const entregues = itensDaMaquina.filter(i=>i.status==='entregue').length;
  if(entregues===total) return 'entregue';
  const separadasOuEntregues = itensDaMaquina.filter(i=>i.status==='separada'||i.status==='entregue').length;
  if(separadasOuEntregues===total) return 'separada';
  const aguardando = itensDaMaquina.filter(i=>i.status==='aguardando').length;
  if(aguardando===total) return 'aguardando';
  return 'em_separacao';
}

// Mesma lógica de `computeMaquinasPainel` (index.html) — ver lá o
// comentário completo. NÃO calcula COM SALDO/SEM SALDO (redesign visual do
// card) — esses 2 números vêm de uma consulta AO VIVO por ETP (ver
// `fetchSaldoPorEtpTracking`/`saldoPorEtp` em `TrackingPicking`), mesclados
// em cada máquina só na hora de renderizar o board, não aqui.
function computeMaquinasPainelTracking(itens, maquinasEtp, hojeStr){
  const porEtp = {};
  itens.forEach(i=>{
    if(!i.etp) return;
    if(!porEtp[i.etp]) porEtp[i.etp] = [];
    porEtp[i.etp].push(i);
  });
  const maquinaPorEtp = {};
  maquinasEtp.forEach(m=>{ maquinaPorEtp[m.etp] = m; });
  const todasEtps = new Set([...Object.keys(porEtp), ...maquinasEtp.map(m=>m.etp)]);

  const lista = Array.from(todasEtps).map(etp=>{
    const itensDaMaquina = porEtp[etp] || [];
    const maquina = maquinaPorEtp[etp] || null;
    const status = maquina ? maquina.status : statusAgregadoMaquinaTracking(itensDaMaquina);
    const dataSeparacao = maquina ? maquina.dataSeparacao : null;
    const atrasada = !!(dataSeparacao && dataSeparacao<hojeStr && status!=='separada' && status!=='entregue');
    return {
      etp, status,
      urgente: maquina ? maquina.urgente : false,
      ordem: maquina ? maquina.ordem : null,
      totalItens: itensDaMaquina.length,
      cliente: maquina ? maquina.cliente : null,
      obs: maquina ? maquina.obs : null,
      observacao: maquina ? maquina.observacao : null,
      chassi: maquina ? maquina.chassi : null,
      codigoProduto: maquina ? maquina.codigoProduto : null,
      descricao: maquina ? maquina.descricao : null,
      linha: maquina ? maquina.linha : null,
      dataSeparacao, atrasada,
    };
  });

  lista.sort((a,b)=>{
    if(a.ordem==null && b.ordem==null) return a.etp.localeCompare(b.etp);
    if(a.ordem==null) return 1;
    if(b.ordem==null) return -1;
    if(a.ordem!==b.ordem) return a.ordem-b.ordem;
    return a.etp.localeCompare(b.etp);
  });
  return lista;
}

// Redesign visual: só 4 buckets agora (a referência enviada pelo cliente só
// tem 4 colunas/4 cores) — `atrasada` não é mais uma coluna própria, cada
// máquina cai na coluna do seu status REAL de qualquer jeito, e o destaque
// de atraso vira só borda+selo no card (ver `MaquinaCardTracking`).
function bucketizeKanbanTracking(maquinas){
  const buckets = {aguardando:[], emSeparacao:[], separada:[], entregue:[]};
  maquinas.forEach(m=>{
    if(m.status==='aguardando') buckets.aguardando.push(m);
    else if(m.status==='em_separacao') buckets.emSeparacao.push(m);
    else if(m.status==='separada') buckets.separada.push(m);
    else if(m.status==='entregue') buckets.entregue.push(m);
  });
  return buckets;
}

// Card de 1 máquina — versão SOMENTE LEITURA, redesign visual (pedido do
// cliente, spec de 32 seções + imagem de referência): card horizontal
// compacto, faixa colorida à esquerda (`corStripe`, cor da coluna),
// ETP/Máquina|Cliente/Chassi+Código à esquerda, os 2 blocos "COM SALDO"/
// "SEM SALDO" à direita, barra de progresso + "N itens" embaixo. O card
// NUNCA repete o texto do status (a coluna já mostra) e NÃO mostra mais
// "Descrição"/observação destacada/Data de Separação — a spec pediu um
// card fixo bem mais compacto (~134px) sem espaço pra essas linhas extras;
// esse dado continua 100% preservado no banco e na tela real "Programação"
// (index.html), só não aparece mais neste card da TV. Urgente/Atrasada
// usam a MESMA linguagem visual discreta (borda 1px + selo pequeno) —
// nunca o card inteiro fica vermelho; se as 2 coisas forem verdade ao
// mesmo tempo, só o selo "Urgente" aparece (prioridade), pra não duplicar
// destaque.
//
// `m.saldo` (mesclado por `TrackingPicking` a partir de `saldoPorEtp`, a
// consulta ao vivo por ETP) é `{status:'loading'|'erro'|'skip'|'ok',
// comSaldo, semSaldo}` — NUNCA mostra um número enquanto `status` não é
// 'ok' (nem um "0" que pareceria resultado real): mostra "…" só enquanto
// `status==='loading'`, senão "—" (cobre 'erro' — consulta falhou — e
// 'skip' — máquina "Aguardando Separação", nunca chega a consultar, ver
// comentário em `TrackingPicking`). `totalItens` continua vindo da fila de
// separação (`sequencia_separacao`) — é um dado DIFERENTE da contagem da
// consulta ao vivo (que é filtrada por outro critério, B1_GRUPO), por isso
// a barra de progresso usa `comSaldo/(comSaldo+semSaldo)`, não
// `comSaldo/totalItens`.
function MaquinaCardTracking({m, corStripe}){
  const classes = ['tp-card'];
  if(m.urgente) classes.push('tp-urgente');
  else if(m.atrasada) classes.push('tp-atrasada');
  const saldo = m.saldo || {status:'loading'};
  const totalSaldo = saldo.status==='ok' ? (saldo.comSaldo + saldo.semSaldo) : 0;
  const pct = totalSaldo>0 ? Math.round((saldo.comSaldo/totalSaldo)*100) : 0;
  const metaChassiCodigo = [
    m.chassi ? `Chassi: ${m.chassi}` : null,
    m.codigoProduto ? `Cód: ${m.codigoProduto}` : null,
  ].filter(Boolean).join(' • ');
  return (
    <div className={classes.join(' ')} style={{'--tp-stripe':corStripe}}>
      <div className="tp-card-top">
        <div className="tp-card-left">
          <div className="tp-etp-row">
            <span className="tp-etp">{m.etp}</span>
            {m.urgente && <span className="tp-badge"><DIconTracking name="alertTriangle" size={10} /> Urgente</span>}
            {!m.urgente && m.atrasada && <span className="tp-badge"><DIconTracking name="clock" size={10} /> Atrasada</span>}
          </div>
          <div className="tp-maquina-cliente">
            {m.obs && <span className="tp-maquina">{m.obs}</span>}
            {m.obs && <span className="tp-sep-txt">|</span>}
            <span className="tp-cliente">{m.cliente || 'Cliente não informado'}</span>
          </div>
          {metaChassiCodigo && <div className="tp-meta">{metaChassiCodigo}</div>}
        </div>
        <div className="tp-card-right">
          <div className="tp-stock-block com">
            <span className="num">{saldo.status==='ok' ? saldo.comSaldo : (saldo.status==='loading' ? '…' : '—')}</span>
            <span className="lbl">COM SALDO</span>
          </div>
          <div className="tp-stock-block sem">
            <span className="num">{saldo.status==='ok' ? saldo.semSaldo : (saldo.status==='loading' ? '…' : '—')}</span>
            <span className="lbl">SEM SALDO</span>
          </div>
        </div>
      </div>
      <div className="tp-card-bottom">
        <div className="tp-bar-track"><div className="tp-bar-fill" style={{width: pct+'%'}}></div></div>
        <span className="tp-itens-txt">{m.totalItens} {m.totalItens===1 ? 'item' : 'itens'}</span>
      </div>
    </div>
  );
}

function TrackingPickingBoard({maquinas}){
  const buckets = bucketizeKanbanTracking(maquinas);
  return (
    <div className="tp-board">
      {SEP_KANBAN_COLUNAS_TRACKING.map(col=>{
        const lista = buckets[col.chave];
        const corVar = `var(${col.cor})`;
        return (
          <div key={col.chave} className="tp-col">
            <div className="tp-col-head" style={{color:corVar,background:`var(${col.corBg})`}}>
              <DIconTracking name={col.icone} size={22} />
              <span>{col.titulo}</span>
              <span className="tp-col-count">{lista.length}</span>
            </div>
            <div className="tp-col-body">
              {lista.length===0 ? (
                <div className="tp-col-empty">
                  <DIconTracking name="box" size={40} />
                  <span>{col.vazio}</span>
                </div>
              ) : (
                lista.map(m=> <MaquinaCardTracking key={m.etp} m={m} corStripe={corVar} />)
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function TrackingPicking({tela, onChange, theme, onToggleTheme, onCicloCompleto, linhaSelecionada, onChangeLinha, onAbrirConfig, links, linkIndex, onSelecionarLink, onNavegarEsquerda, onNavegarDireita, segundosLinhaTracking, status, maquinasEtp, itens, linhasProducao}){
  // Busca de dado (status/maquinasEtp/itens) e o polling de 5 min +
  // Realtime AGORA vivem em App() — mesmo motivo de `PainelIndicadores`
  // (ver comentário completo lá): o rodízio automático desmontava este
  // componente toda vez que trocava de tela, perdendo todo dado carregado
  // e recomeçando do zero na próxima vez.

  // `linhaSelecionada` mora no App() agora (não mais um useState local
  // aqui) — necessário pra permitir a navegação por controle remoto
  // (ArrowLeft/ArrowRight, ver App()) andar pela MESMA sequência de telas
  // que já existe (Indicadores → Elétrica → SEM → SSE → SEP), inclusive
  // cruzando a fronteira entre "Painel Indicadores" e "Tracking Picking".
  // O TIMER/CICLO AUTOMÁTICO abaixo continua EXATAMENTE igual (mesmo
  // intervalo de 30s, mesma condição de "completou as 4 linhas" chamando
  // `onCicloCompleto`) — só a variável que ele lê/escreve passou a viver
  // 1 nível acima.
  //
  // Guarda a leitura mais recente de `linhaSelecionada` num ref — o valor
  // agora pode mudar por 3 fontes (esta rotação automática, clique manual
  // numa aba, ou seta do controle remoto lá no App()), e o `setInterval`
  // abaixo só é recriado quando `onCicloCompleto`/`onChangeLinha` mudam de
  // referência (não a cada troca de linha) — sem o ref, ele leria sempre
  // o valor "congelado" de quando foi criado.
  const linhaAtualRef = useRef(linhaSelecionada);
  useEffect(() => { linhaAtualRef.current = linhaSelecionada; }, [linhaSelecionada]);

  // Mesmo motivo do ref acima, agora pra `linhasProducao` (lista dinâmica,
  // vinda de App()/Supabase — ver "PROGRAMAÇÃO: LINHAS DE PRODUÇÃO
  // GERENCIÁVEIS" no schema.sql): o `setInterval` abaixo só é recriado
  // quando `onCicloCompleto`/`onChangeLinha`/`segundosLinhaTracking` mudam,
  // não a cada linha nova/renomeada/excluída por um líder em outro
  // aparelho — sem o ref, uma mudança na lista reiniciaria o timer no meio
  // da contagem.
  const linhasProducaoRef = useRef(linhasProducao);
  useEffect(() => { linhasProducaoRef.current = linhasProducao; }, [linhasProducao]);

  // `onChangeLinha(...)`/`onCicloCompleto()` como 2 chamadas DIRETAS
  // dentro do callback do timer (nunca uma aninhada dentro de uma função
  // updater de setState) — mesma correção de bug já aplicada antes (ver
  // histórico): chamar o setState de um componente DIFERENTE de dentro do
  // updater de outro conta como "atualizar um componente enquanto
  // renderiza outro" pro React.
  useEffect(() => {
    const id = setInterval(() => {
      const linhas = linhasProducaoRef.current;
      if(linhas.length===0) return;
      const idxAtual = linhas.findIndex(l=>l.nome===linhaAtualRef.current);
      const proximoIdx = idxAtual + 1;
      if(proximoIdx >= linhas.length){
        onChangeLinha(linhas[0].nome);
        if(onCicloCompleto) onCicloCompleto();
      } else {
        onChangeLinha(linhas[proximoIdx].nome);
      }
    }, segundosLinhaTracking*1000);
    return () => clearInterval(id);
  }, [onCicloCompleto, onChangeLinha, segundosLinhaTracking]);


  // Cada ETP/máquina/item já carrega sua PRÓPRIA `linha` diretamente (ver
  // "PROGRAMAÇÃO: MESMA ETP EM VÁRIAS LINHAS" no schema.sql — a mesma ETP
  // pode ter um card independente por linha) — não usa mais um mapa
  // etp→linha derivado só da máquina (isso misturaria os itens das 2
  // linhas quando a mesma ETP existisse em ambas). `linhaPadraoAtualTracking`
  // (1ª linha da lista) é só o fallback pra `linha` nula.
  const linhaPadraoAtualValor = linhaPadraoAtualTracking(linhasProducao);
  const maquinasEtpDaLinha = maquinasEtp.filter(m=>(m.linha || linhaPadraoAtualValor)===linhaSelecionada);
  const itensDaLinha = itens.filter(i=>(i.linha || linhaPadraoAtualValor)===linhaSelecionada);
  const hojeStr = new Date().toISOString().slice(0,10);
  const maquinasPainel = status==='ok' ? computeMaquinasPainelTracking(itensDaLinha, maquinasEtpDaLinha, hojeStr) : [];
  // Nota (não erro) — ver comentário em `carregarDados`: as duas listas
  // vazias tanto podem ser fila vazia de verdade quanto conta sem acesso à
  // tela "Programação". Mostra só como lembrete, nunca troca o Kanban por
  // uma tela de erro.
  const avisoPossivelSemAcesso = status==='ok' && maquinasEtp.length===0 && itens.length===0;

  // COM SALDO/SEM SALDO (redesign visual do card) — consulta AO VIVO por
  // ETP (ver `fetchSaldoPorEtpTracking`), só pras ETPs da linha visível
  // AGORA (nunca as 4 linhas de uma vez — ver comentário em
  // `carregarDadosTracking`, App()). `saldoPorEtp` é um Map etp→
  // `{status:'loading'|'erro'|'ok', comSaldo, semSaldo}`, mesclado em cada
  // máquina logo abaixo, na hora de montar `maquinasPainelComSaldo`.
  const [saldoPorEtp, setSaldoPorEtp] = useState(() => new Map());
  // Máquina "Aguardando Separação" NUNCA consulta saldo (pedido do
  // cliente): reduz bastante o total de consultas por linha — é a coluna
  // que mais tem máquina, e ainda não faz sentido saber "tem saldo" de algo
  // que nem começou a ser separado. O card dela mostra "—" fixo nos 2
  // blocos (ver `saldo.status==='skip'` em `MaquinaCardTracking`), nunca
  // tenta a consulta.
  // Chave estável da lista de ETPs visíveis, JÁ SEM as "Aguardando"
  // (ordenada, sem duplicar) — só muda de verdade quando uma ETP relevante
  // entra/sai da linha atual, não a cada atualização de status/urgente/
  // ordem (que recriaria `maquinasPainel` com os MESMOS ETPs, mas passaria
  // um array novo — usar isso direto como dependência do efeito abaixo
  // dispararia consulta ao vivo à toa a cada mudancinha).
  const etpsVisiveisChave = Array.from(new Set(maquinasPainel.filter(m=>m.status!=='aguardando').map(m=>m.etp))).sort().join(',');
  // Busca cada ETP como uma promise INDEPENDENTE — nunca `Promise.all`
  // esperando todas juntas. Bug real pego no teste visual: com
  // `Promise.all`, 1 ETP lenta/travada (a consulta upstream pode demorar
  // até 15s) segurava o card de TODAS as outras ETPs da linha em "…" —
  // mesmo as que já tinham voltado rápido. Cada `.then()` aqui aplica o
  // resultado daquela ETP assim que ELA chega, sem esperar as demais.
  // `executarComLimiteDeConcorrencia` (ver comentário completo lá) limita
  // quantas rodam AO MESMO TEMPO — 2º bug real, também pego em teste
  // visual (print do cliente com a aba "SEM", ~18 máquinas): sem esse
  // limite, TODAS disparavam juntas (~36 requisições upstream de uma vez)
  // e sobrecarregavam o sistema legado da Selgron, travando todo mundo em
  // "…" por muito tempo.
  function buscarSaldoDeCadaEtp(etps, cancelRef){
    const tarefas = etps.map(etp => () => fetchSaldoPorEtpTracking(etp).then(res => {
      if(cancelRef.cancelado) return;
      setSaldoPorEtp(prev => {
        const proximo = new Map(prev);
        proximo.set(etp, res.ok ? {status:'ok', comSaldo:res.comSaldo, semSaldo:res.semSaldo} : {status:'erro', erro:res.erro});
        return proximo;
      });
    }));
    executarComLimiteDeConcorrencia(tarefas, LIMITE_CONCORRENCIA_SALDO_TRACKING);
  }
  useEffect(() => {
    const etps = etpsVisiveisChave ? etpsVisiveisChave.split(',') : [];
    if(etps.length===0) return;
    const cancelRef = {cancelado:false};
    // Marca como 'loading' só as ETPs que ainda não têm nenhum resultado
    // (nunca reseta uma ETP que já tem um resultado 'ok'/'erro' anterior
    // pra 'loading' de novo — evita o número sumir/piscar "…" a cada
    // atualização automática, só troca quando o novo resultado chegar).
    setSaldoPorEtp(prev => {
      let mudou = false;
      const proximo = new Map(prev);
      etps.forEach(etp => { if(!proximo.has(etp)){ proximo.set(etp, {status:'loading'}); mudou = true; } });
      return mudou ? proximo : prev;
    });
    buscarSaldoDeCadaEtp(etps, cancelRef);
    return () => { cancelRef.cancelado = true; };
  }, [etpsVisiveisChave]);
  // Atualização periódica (5 min, mesmo intervalo do resto do painel) —
  // além do efeito acima (que só dispara quando uma ETP entra/sai da
  // linha), isto garante que o saldo de uma ETP que continua na tela por
  // muito tempo também se atualiza (o saldo real muda o dia todo).
  useEffect(() => {
    const cancelRef = {cancelado:false};
    const id = setInterval(() => {
      const etps = etpsVisiveisChave ? etpsVisiveisChave.split(',') : [];
      if(etps.length===0) return;
      buscarSaldoDeCadaEtp(etps, cancelRef);
    }, 5*60*1000);
    return () => { clearInterval(id); cancelRef.cancelado = true; };
  }, [etpsVisiveisChave]);
  const maquinasPainelComSaldo = maquinasPainel.map(m => ({...m, saldo: m.status==='aguardando' ? {status:'skip'} : (saldoPorEtp.get(m.etp) || {status:'loading'})}));

  return (
    <div>
      <PanelTabs tela={tela} onChange={onChange} onAbrirConfig={onAbrirConfig} links={links} linkIndex={linkIndex} onSelecionarLink={onSelecionarLink} onNavegarEsquerda={onNavegarEsquerda} onNavegarDireita={onNavegarDireita} theme={theme} onToggleTheme={onToggleTheme} />
      {/* Layout de ALTURA FIXA (nunca escala por transform) — pedido do
          cliente: "esse painel é fixo, não precisa ficar alternando
          tamanho ou localização" (via print real — trocar de linha
          fazia o board mudar visivelmente de tamanho/posição, já que uma
          linha vazia tem conteúdo natural bem menor que uma linha cheia
          de máquinas, e a versão anterior escalava esse conteúdo por
          `transform:scale`, então cada linha "pulava" pra um tamanho
          diferente). `.content-tracking` (ver CSS) fixa a altura em
          `calc(100vh - 56px)` sempre — cada coluna do Kanban (ver
          `.tp-col-body` no CSS) estica pra preencher essa MESMA altura
          sempre, tenha 0 ou várias máquinas: poucas deixam espaço vazio
          DENTRO da coluna (honesto, e não afeta o tamanho/posição do
          board), muitas empurram a coluna (e a página) pra baixo — nunca
          mais transform, nunca mais "pular" de tamanho. `.tp-page` (ver
          CSS) só dá as variáveis de cor do redesign visual pra esta tela
          — sem afetar Indicadores/Pedidos de Compra. */}
      <div className="content content-tracking tp-page">
      {(status==='sem-sessao' || status==='erro') && (
        <div className="demo-banner">
          Esta página não conseguiu carregar a fila de separação ao vivo. Verifique se a conta de login
          automático da TV (TV_LOGIN_IDENTIFIER/TV_LOGIN_SENHA) está configurada e com acesso liberado à
          tela "Programação" em "Gerenciar usuários" → acessos extras.
        </div>
      )}

      {avisoPossivelSemAcesso && (
        <div className="demo-banner">
          Nenhuma ETP encontrada. Se a fila não estiver realmente vazia, confira se a conta de login
          automático da TV tem acesso liberado à tela "Programação" em "Gerenciar usuários" → acessos extras.
        </div>
      )}

      {status==='ok' && (
        <React.Fragment>
          <div className="tp-pill-row">
            {linhasProducao.map(l=>(
              <button
                key={l.nome} type="button"
                className={'tp-pill' + (linhaSelecionada===l.nome ? ' active' : '')}
                onClick={()=>onChangeLinha(l.nome)}
              >{l.nome}</button>
            ))}
          </div>
          <TrackingPickingBoard maquinas={maquinasPainelComSaldo} />
        </React.Fragment>
      )}
      </div>
    </div>
  );
}

   Pedidos de Compra — 3ª tela do painel. Sugestão do cliente: puxar da
   MESMA consulta Selgron já usada em index.html (consulta.selgron.com.br,
   por trás dela o Protheus), só que outra aba/página dela
   (pedido_compra_aberto.php, não produto.consulta.php) — pedidos de
   compra em aberto com ENTREGA pra hoje, resumidos (nº de pedidos/

   `consultar-produto-selgron`, reaproveita as MESMAS credenciais
   CONSULTA_SELGRON_USER/PASS) — NÃO grava nada no Supabase, é AO VIVO a
   cada carregamento, sem sincronismo em lote.

   ATENÇÃO — calibrado só a partir de um PRINT da tela real (ninguém com

// Mesmo padrão de tratamento de erro de `fetchSaldoConsultaSelgron`
// (index.html): lê o corpo JSON real do erro via `error.context.json()`
// quando existe (senão a mensagem genérica do supabase-js não diz nada
// útil sobre o que a Edge Function realmente respondeu).
async function fetchPedidosCompraSelgron(){
  if(!supabaseClient) return {ok:false, erro:'Não configurado.'};
  try{
    const { data, error } = await supabaseClient.functions.invoke('consultar-pedidos-compra-selgron');
    if(error){
      let erro = error.message;
      if(error.context && typeof error.context.json==='function'){
        try{
          const corpo = await error.context.json();
          if(corpo && corpo.erro) erro = corpo.erro;
        }catch(_e){ /* corpo não era JSON — mantém a mensagem genérica */ }
      }
      return {ok:false, erro};
    }
    return data;
  }catch(err){
    return {ok:false, erro:String(err && err.message || err)};
  }
}
