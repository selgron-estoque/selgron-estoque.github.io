function PedidosCompraPanel({tela, onChange, theme, onToggleTheme, onAbrirConfig, links, linkIndex, onSelecionarLink, onNavegarEsquerda, onNavegarDireita, status, pedidos, ultimaAtualizacao}){
  // Busca de dado (status/pedidos/ultimaAtualizacao) e o polling de 5 min
  // AGORA vivem em App() — mesmo motivo de `PainelIndicadores` (ver
  // comentário completo lá): o rodízio automático desmontava este
  // componente toda vez que trocava de tela, perdendo todo dado carregado
  // e recomeçando do zero (mostrando o carregando/exemplo de novo) TODA
  // vez que "Pedidos de Compra" voltava a aparecer, não só na 1ª vez.

  // Todos os hooks ficam ANTES de qualquer `return` condicional (ver
  // `if(status==='loading')` mais abaixo) — Rules of Hooks: precisam
  // rodar na MESMA ordem em todo render, então o que muda com o status é
  // só o JSX final, nunca quais hooks são chamados.
  const [indiceExpandido, setIndiceExpandido] = useState(0);
  const cardRefs = useRef([]);

  // Relógio próprio só pro contador "próxima atualização em MM:SS" do
  // rodapé — não busca dado nenhum (isso é o `ultimaAtualizacao`/
  // `carregarDadosPedidosCompra` de App(), aqui é só o TEXTO do contador
  // que precisa de um tick de 1s pra não ficar parado).
  const [agoraTick, setAgoraTick] = useState(() => new Date());
  useEffect(() => {
    const id = setInterval(() => setAgoraTick(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  const dadosAoVivo = status==='ok';
  const hojeStr = hojeLocalStr();
  const pedidosHoje = dadosAoVivo
    ? pedidos.filter(p=>p.entrega===hojeStr)
    : DEMO_PEDIDOS_COMPRA;

  // Agrupa por PEDIDO+FORNECEDOR (redesign do painel operacional —
  // "não usar tabela tradicional... agrupar por pedido/fornecedor") —
  // cada grupo vira 1 card expansível (`PedidoCardExpandivel`), com os
  // produtos daquele pedido dentro.
  const gruposMap = new Map();
  pedidosHoje.forEach(p => {
    const chave = (p.numero||'—') + '||' + (p.fornecedor||'—');
    if(!gruposMap.has(chave)) gruposMap.set(chave, {numero:p.numero, fornecedor:p.fornecedor, itens:[]});
    gruposMap.get(chave).itens.push(p);
  });
  const grupos = Array.from(gruposMap.values()).map(g => ({
    ...g,
    totalItens: g.itens.length,
    totalUnidades: g.itens.reduce((soma,it)=>soma+(it.quantidade||0), 0),
  }));

  // "Itens" (card de KPI) = quantidade de LINHAS distintas no total,
  // nunca a soma de `quantidade` (pedido explícito do cliente — 4 linhas
  // com 17 unidades no total mostra "4", não "17"; mesmo critério de
  // sempre nesta tela, agora também usado por card em `totalItens`).
  const numerosDistintos = new Set(pedidosHoje.map(p=>p.numero).filter(Boolean));
  const fornecedoresDistintos = new Set(pedidosHoje.map(p=>p.fornecedor).filter(Boolean));
  const totalItens = pedidosHoje.length;

  // Rotação automática de qual card fica expandido — pedido do cliente
  // pra TV: "mostrar cada grupo por 8-12s antes de avançar", preservando
  // a interação manual (clicar num card manualmente reagenda o próximo
  // avanço automático a partir dali, mesmo padrão já usado no resto do
  // Painel — ver `TrackingPicking`/`LinkExternoPanel`). Reseta pro
  // primeiro se a lista encolher (refresh) e o índice atual não existir
  // mais.
  useEffect(() => {
    if(indiceExpandido >= grupos.length) setIndiceExpandido(0);
  }, [grupos.length, indiceExpandido]);

  useEffect(() => {
    if(grupos.length <= 1) return;
    const id = setTimeout(() => {
      setIndiceExpandido(idx => (idx+1) % grupos.length);
    }, 10000);
    return () => clearTimeout(id);
  }, [indiceExpandido, grupos.length]);

  // Rolagem suave até o card expandido da vez — cobre o caso de ter mais
  // pedidos do que cabem na tela de uma vez (pedido do cliente: "rolagem
  // vertical automática muito suave"). `scroll-behavior:smooth` no CSS
  // de `.pc-list` já cuida da suavidade; aqui só decide QUANDO rolar.
  useEffect(() => {
    const el = cardRefs.current[indiceExpandido];
    if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, [indiceExpandido]);

  const agora = new Date();
  const proximaAtualizacao = ultimaAtualizacao ? new Date(ultimaAtualizacao.getTime() + 5*60*1000) : null;
  const segundosRestantes = proximaAtualizacao ? Math.max(0, Math.round((proximaAtualizacao - agoraTick)/1000)) : null;
  const contagemRegressiva = segundosRestantes!=null
    ? String(Math.floor(segundosRestantes/60)).padStart(2,'0')+':'+String(segundosRestantes%60).padStart(2,'0')
    : '—:—';

  // Estado de carregamento genuíno — antes, "loading" caía junto com
  // "sem-sessao"/"erro" no fallback pros dados de exemplo, então a tela
  // mostrava os pedidos demo (e "Última atualização: —") por alguns
  // segundos toda vez que a aba abria, antes da 1ª consulta real na
  // Selgron terminar — parecia "carregou errado e se corrigiu sozinho".
  // Agora esse instante mostra só um carregando, sem número nenhum.
  if(status==='loading'){
    return (
      <div className="pc-page">
        <PanelTabs tela={tela} onChange={onChange} onAbrirConfig={onAbrirConfig} links={links} linkIndex={linkIndex} onSelecionarLink={onSelecionarLink} onNavegarEsquerda={onNavegarEsquerda} onNavegarDireita={onNavegarDireita} theme={theme} onToggleTheme={onToggleTheme} />
        <div className="pc-container">
          <div className="pc-header">
            <div className="pc-header-left">
              <div className="pc-header-icon"><PcIcon name="caixa" size={28} /></div>
              <div className="pc-header-text">
                <h1 className="pc-title">Pedidos de Compra</h1>
                <div className="pc-subtitle">Entregas previstas para hoje</div>
              </div>
            </div>
          </div>
          <div className="pc-loading">
            <div className="pc-loading-spinner"></div>
            <div className="pc-loading-text">Carregando pedidos de compra…</div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="pc-page">
      <PanelTabs tela={tela} onChange={onChange} onAbrirConfig={onAbrirConfig} links={links} linkIndex={linkIndex} onSelecionarLink={onSelecionarLink} onNavegarEsquerda={onNavegarEsquerda} onNavegarDireita={onNavegarDireita} theme={theme} onToggleTheme={onToggleTheme} />
      <div className="pc-container">

        <div className="pc-header">
          <div className="pc-header-left">
            <div className="pc-header-icon"><PcIcon name="caixa" size={28} /></div>
            <div className="pc-header-text">
              <h1 className="pc-title">Pedidos de Compra</h1>
              <div className="pc-subtitle">Entregas previstas para hoje</div>
            </div>
          </div>
          <div className="pc-info-blocks">
            <div className="pc-info-card">
              <div className="pc-info-card-label">{DIAS_SEMANA_PT_LONGO[agora.getDay()]}</div>
              <div className="pc-info-card-value">{formatarDataPtBr(agora)}</div>
            </div>
            <div className="pc-info-card pc-update-card">
              <div className="pc-info-card-label">Última atualização</div>
              <div className="pc-info-card-value">{ultimaAtualizacao ? formatarHoraPtBr(ultimaAtualizacao) : '—'}</div>
            </div>
          </div>
        </div>

        <div className="pc-cards-row">
          <div className="pc-card azul">
            <div className="pc-card-icon-wrap"><PcIcon name="documento" size={24} /></div>
            <div className="pc-card-body">
              <div className="pc-card-valor">{numerosDistintos.size}</div>
              <div className="pc-card-label">Pedidos</div>
              <div className="pc-card-desc">Entrega prevista para hoje</div>
            </div>
          </div>
          <div className="pc-card roxo">
            <div className="pc-card-icon-wrap"><PcIcon name="caminhao" size={24} /></div>
            <div className="pc-card-body">
              <div className="pc-card-valor">{fornecedoresDistintos.size}</div>

          <div className="pc-list">
            {grupos.map((g,i) => (
              <PedidoCardExpandivel
                key={g.numero+'|'+g.fornecedor+'|'+i}

              />
            ))}
          </div>
        )}
      </div>

      <div className="pc-footer">
        <div className="pc-footer-left">
          <span aria-hidden="true">↻</span> Próxima atualização automática em <span className="pc-footer-count">{contagemRegressiva}</span>
        </div>
        <div className="pc-footer-right">{fornecedoresDistintos.size} fornecedores · {numerosDistintos.size} pedidos · {totalItens} itens</div>
      </div>
    </div>
  );
}

// Escala o conteúdo do filho (tamanho FIXO — sempre os mesmos 8 gráficos,
// nunca uma lista que cresce) pra caber 100% em qualquer tamanho de tela,
// sem cortar nem precisar rolar — mede o tamanho NATURAL do conteúdo (sem
// escala nenhuma) contra o espaço disponível e aplica a MENOR proporção
// necessária pros dois eixos (largura/altura) baterem, preservando a
// proporção original (mesma ideia de `object-fit: contain` numa imagem).
// Sem limite superior de propósito — numa TV grande, amplia pra preencher
// a tela de verdade em vez de deixar uma ilha pequena cercada de vazio.
// Reage tanto a resize da janela quanto a mudança de tamanho do próprio
// conteúdo (ResizeObserver — cobre o gráfico carregando/trocando de dado
// ao vivo pro exemplo e vice-versa, sem precisar de nenhuma dependência
// manual no useEffect).
function FitToScreen({children}){
  const outerRef = useRef(null);
  const innerRef = useRef(null);
  // Escala X/Y INDEPENDENTE de propósito (não `Math.min` de uma só escala
  // proporcional) — preencher os dois eixos por completo é mais importante,
  // numa TV, do que preservar a proporção exata: a versão proporcional
  // (`object-fit:contain`) deixava sobra de espaço vazio nos 2 lados
  // sempre que a proporção da tela não batia EXATAMENTE com a do painel
  // (praticamente sempre), o que lia como "painel pequeno boiando no
  // meio da tela" — pedido explícito do cliente foi mudar isso. Único
  // efeito colateral: o gráfico de rosca (círculo) pode ficar levemente
  // oval quando a proporção da tela for bem diferente de ~4:3 (a do
  // conteúdo natural, ver `.fit-screen-inner{width:1600px}`).
  //
  // Usado só pela aba Indicadores (tamanho FIXO — sempre os mesmos 8
  // gráficos) — o Tracking Picking já tentou usar isto também, mas o
  // Kanban de lá tem altura natural bem VARIÁVEL (0 a várias máquinas
  // por coluna), e trocar de linha fazia o board mudar de tamanho a
  // cada vez (às vezes bem esticado com pouca máquina) — pedido do
  // cliente foi um layout FIXO lá, que nunca muda de tamanho/posição
  // (ver `.content-tracking`/`.tp-board` no CSS — grid com
  // `align-items:stretch`, sem nenhum transform).
  const [escala, setEscala] = useState({x:1, y:1});

  useEffect(() => {
    const outer = outerRef.current, inner = innerRef.current;
    if(!outer || !inner) return;
    function ajustarEscala(){
      // Mede em tamanho natural — o `transform:scale` de uma medição
      // anterior nunca afeta `scrollWidth/scrollHeight` (são do layout,
      // não do transform), então não precisa resetar antes de medir.
      const contentW = inner.scrollWidth;
      const contentH = inner.scrollHeight;
      if(contentW===0 || contentH===0) return;
      const x = outer.clientWidth/contentW;
      const y = outer.clientHeight/contentH;
      setEscala({x: x>0?x:1, y: y>0?y:1});
    }
    ajustarEscala();
    const ro = new ResizeObserver(ajustarEscala);
    ro.observe(inner);
    window.addEventListener('resize', ajustarEscala);
    return () => { ro.disconnect(); window.removeEventListener('resize', ajustarEscala); };
  }, []);

  return (
    <div ref={outerRef} className="fit-screen-outer">
      <div ref={innerRef} className="fit-screen-inner" style={{transform:`scale(${escala.x}, ${escala.y})`}}>
        {children}
      </div>
    </div>
  );
}

function App(){
  const [tela, setTela] = useState('indicadores');
  // `linhaSelecionada` (Elétrica/SEM/SSE/SEP) subiu do TrackingPicking pra

  // remoto (ArrowLeft/ArrowRight, mais abaixo) conseguir navegar através
  // da fronteira entre "Painel Indicadores" e "Tracking Picking" na MESMA
  // sequência que a troca automática já percorre.
  const [linhaSelecionada, setLinhaSelecionada] = useState(LINHA_PADRAO_TRACKING);

  // Abas de link externo (lista, ver histórico: 1ª versão só aceitava 1
  // link, cliente pediu "consigo criar mais abas com outros links?") —
  // busca uma vez + Realtime (mesmo padrão de `ordemVisivel`/
  // `painel_indicadores_config` em PainelIndicadores), aqui em App() porque
  // tanto o rodízio automático quanto o controle remoto (mais abaixo)
  // precisam saber a lista inteira. `temLink` deriva do tamanho da lista —
  // lista vazia = nenhuma aba de link existe, sem precisar de outro campo
  // booleano separado (ver ConteudoConfigLink). `linkIndex` (qual link

  // `linhaSelecionada` acima: vive aqui pra permitir o controle remoto
  // cruzar a fronteira entre telas na mesma sequência única.
  const [linksExternos, setLinksExternos] = useState([]);
  const [linkIndex, setLinkIndex] = useState(0);
  const temLink = linksExternos.length > 0;
  useEffect(() => {
    let cancelado = false;
    fetchLinksExternos().then(v => { if(!cancelado) setLinksExternos(v); });
    if(!supabaseClient) return () => { cancelado = true; };
    const canal = supabaseClient
      .channel('realtime:painel_links_externos')
      .on('postgres_changes', {event:'*', schema:'public', table:'painel_links_externos'}, () => {
        fetchLinksExternos().then(v => { if(!cancelado) setLinksExternos(v); });
      })
      .subscribe();
    return () => { cancelado = true; supabaseClient.removeChannel(canal); };
  }, []);
  // Se um link for removido (por qualquer aparelho) e `linkIndex` ficar
  // apontando pra uma posição que não existe mais na lista, volta pro
  // primeiro — nunca deixa `links[linkIndex]` indefinido.
  useEffect(() => {
    if(linkIndex > 0 && linkIndex >= linksExternos.length) setLinkIndex(0);
  }, [linksExternos.length, linkIndex]);

  // Tempo (segundos) de cada TIPO de tela — pedido do cliente: "quero a
  // opção de colocar quanto tempo eu quero que rode cada tela". Mesmo
  // padrão de busca-uma-vez + Realtime das outras configs deste arquivo;
  // aqui em App() porque o efeito do Indicadores logo abaixo e os 2

  const [temposConfig, setTemposConfig] = useState(TEMPOS_PADRAO);
  useEffect(() => {
    let cancelado = false;
    fetchTemposConfig().then(v => { if(!cancelado) setTemposConfig(v); });
    if(!supabaseClient) return () => { cancelado = true; };
    const canal = supabaseClient
      .channel('realtime:painel_tempos_config')
      .on('postgres_changes', {event:'*', schema:'public', table:'painel_tempos_config'}, () => {
        fetchTemposConfig().then(v => { if(!cancelado) setTemposConfig(v); });
      })
      .subscribe();
    return () => { cancelado = true; supabaseClient.removeChannel(canal); };
  }, []);

  // Quais indicadores aparecem/em que ordem na tela "Indicadores" — subiu
  // de dentro de PainelIndicadores pra cá (mesmo padrão de
  // `linksExternos`/`temposConfig` acima) porque o botão único de

  const [ordemIndicadores, setOrdemIndicadores] = useState(INDICADORES_PADRAO);
  useEffect(() => {

    if(!supabaseClient) return () => { cancelado = true; };

      })

  }, []);

  // ---- Dado AO VIVO das 3 telas do rodízio (Indicadores/Pedidos de
  // Compra/Tracking Picking) — TAMBÉM subiu pra cá, mesmo padrão de
  // `linksExternos`/`temposConfig`/`ordemIndicadores` acima. Antes, cada
  // painel buscava seu próprio dado dentro de si mesmo (`useEffect` no
  // próprio componente) — funcionava pra quem ficava numa tela só, mas o

  // selecionado é renderizado, ver `{tela==='X' && <Painel/>}` no return
  // abaixo), e desmontar mata TODO estado local, incluindo o dado já
  // carregado. Resultado: toda vez que o rodízio voltava pra uma tela,
  // ela recomeçava do zero (`status='loading'`, mostrando exemplo/
  // carregando) mesmo tendo mostrado dado real minutos antes — cliente
  // relatou como "fica mostrando um dado aleatório, depois carrega o
  // certo" toda vez que trocava de aba. Com o dado vivendo aqui, a busca
  // (e o polling de 5 min/Realtime) continuam rodando em segundo plano
  // INDEPENDENTE de qual aba está visível — a troca de tela vira só
  // trocar o que aparece na tela, com o dado quase sempre já pronto (só a
  // 1ª vez que a TV liga é que aparece "carregando" de verdade).

  const [statusIndicadores, setStatusIndicadores] = useState('loading');
  const [countsIndicadores, setCountsIndicadores] = useState([]);
  const [historicoIndicadores, setHistoricoIndicadores] = useState([]);
  const [inventariosIndicadores, setInventariosIndicadores] = useState([]);
  const carregarDadosIndicadores = useCallback(async () => {
    if(!supabaseClient){ setStatusIndicadores('erro'); return; }
    try{
      let { data: sessionData } = await supabaseClient.auth.getSession();
      if(!sessionData || !sessionData.session){
        const logou = await tentarLoginSilenciosoTv();
        if(logou){
          ({ data: sessionData } = await supabaseClient.auth.getSession());
        }
      }
      if(!sessionData || !sessionData.session){
        setStatusIndicadores('sem-sessao');
        return;
      }
      sincronizarAuthRealtime(sessionData.session);
      const [countsData, historicoData, inventariosParaPainel] = await Promise.all([
        fetchContagensParaPainel(),
        fetchHistoricoParaTendencia(),
        fetchInventariosParaPainel(),
      ]);
      setCountsIndicadores(countsData);
      setHistoricoIndicadores(historicoData);
      setInventariosIndicadores(inventariosParaPainel);
      setStatusIndicadores('ok');
    }catch(err){
      console.warn('Painel Indicadores: falha ao carregar dados ao vivo', err);
      setStatusIndicadores('erro');
    }
  }, []);
  useEffect(() => {
    carregarDadosIndicadores();
    const id = setInterval(carregarDadosIndicadores, 5*60*1000);
    return () => clearInterval(id);
  }, [carregarDadosIndicadores]);
  useEffect(() => {
    if(!supabaseClient) return;
    const { data: authListener } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      sincronizarAuthRealtime(session);
    });
    const canal = supabaseClient
      .channel('realtime:contagens')
      .on('postgres_changes', {event:'*', schema:'public', table:'contagens'}, () => {
        carregarDadosIndicadores();
      })
      .subscribe();
    return () => {
      authListener.subscription.unsubscribe();
      supabaseClient.removeChannel(canal);
    };
  }, [carregarDadosIndicadores]);

  const [statusPedidosCompra, setStatusPedidosCompra] = useState('loading');
  const [pedidosCompra, setPedidosCompra] = useState([]);
  const [ultimaAtualizacaoPedidosCompra, setUltimaAtualizacaoPedidosCompra] = useState(null);
  const carregarDadosPedidosCompra = useCallback(async () => {
    if(!supabaseClient){ setStatusPedidosCompra('erro'); setUltimaAtualizacaoPedidosCompra(new Date()); return; }
    try{
      let { data: sessionData } = await supabaseClient.auth.getSession();
      if(!sessionData || !sessionData.session){
        const logou = await tentarLoginSilenciosoTv();
        if(logou){
          ({ data: sessionData } = await supabaseClient.auth.getSession());
        }
      }
      if(!sessionData || !sessionData.session){
        setStatusPedidosCompra('sem-sessao');
        setUltimaAtualizacaoPedidosCompra(new Date());
        return;
      }
      sincronizarAuthRealtime(sessionData.session);
      const resultado = await fetchPedidosCompraSelgron();

      setStatusPedidosCompra('ok');

    }catch(err){
      console.warn('Pedidos de Compra: falha ao carregar dados ao vivo', err);
      setStatusPedidosCompra('erro');
      setUltimaAtualizacaoPedidosCompra(new Date());
    }
  }, []);
  useEffect(() => {
    carregarDadosPedidosCompra();
    const id = setInterval(carregarDadosPedidosCompra, 5*60*1000);
    return () => clearInterval(id);
  }, [carregarDadosPedidosCompra]);

  const [statusTracking, setStatusTracking] = useState('loading');
  const [maquinasEtpTracking, setMaquinasEtpTracking] = useState([]);
  const [itensTracking, setItensTracking] = useState([]);
  const carregarDadosTracking = useCallback(async () => {
    if(!supabaseClient){ setStatusTracking('erro'); return; }
    try{
      let { data: sessionData } = await supabaseClient.auth.getSession();
      if(!sessionData || !sessionData.session){
        const logou = await tentarLoginSilenciosoTv();
        if(logou){
          ({ data: sessionData } = await supabaseClient.auth.getSession());
        }
      }
      if(!sessionData || !sessionData.session){
        setStatusTracking('sem-sessao');
        return;
      }
      sincronizarAuthRealtime(sessionData.session);
      // COM SALDO/SEM SALDO (redesign visual do card) NÃO é buscado aqui —
      // é ao vivo, por ETP, e só pras ETPs da linha visível agora (ver
      // `saldoPorEtp`/efeito de busca dentro de `TrackingPicking`): buscar
      // aqui, pra TODAS as linhas de uma vez, dispararia consulta ao vivo
      // pra dezenas de ETPs que nem estão na tela.
      const [maquinasData, itensData] = await Promise.all([
        fetchMaquinasEtpTracking(),
        fetchItensSeparacaoTracking(),
      ]);
      setMaquinasEtpTracking(maquinasData);
      setItensTracking(itensData);
      setStatusTracking('ok');
    }catch(err){
      console.warn('Tracking Picking: falha ao carregar dados ao vivo', err);
      setStatusTracking('erro');
    }
  }, []);
  useEffect(() => {
    carregarDadosTracking();
    const id = setInterval(carregarDadosTracking, 5*60*1000);
    return () => clearInterval(id);
  }, [carregarDadosTracking]);
  useEffect(() => {
    if(!supabaseClient) return;
    const canalMaquinas = supabaseClient
      .channel('realtime:maquinas_etp:tracking')
      .on('postgres_changes', {event:'*', schema:'public', table:'maquinas_etp'}, () => { carregarDadosTracking(); })
      .subscribe();
    const canalItens = supabaseClient
      .channel('realtime:sequencia_separacao:tracking')
      .on('postgres_changes', {event:'*', schema:'public', table:'sequencia_separacao'}, () => { carregarDadosTracking(); })
      .subscribe();
    return () => {
      supabaseClient.removeChannel(canalMaquinas);
      supabaseClient.removeChannel(canalItens);
    };
  }, [carregarDadosTracking]);

  // Linhas de produção (abas do Tracking Picking) — pedido do cliente:
  // "caso algum dia eu queira acrescentar novas abas" (gerenciado na tela
  // real "Programação", index.html — ver GerenciarLinhasModal lá). A TV só
  // LEITURA aqui, nunca gerencia. Sem gate de login próprio: reaproveita a
  // MESMA sessão que qualquer um dos 3 `carregarDados*` acima já
  // estabelece (refetch disparado assim que qualquer um deles chega em
  // 'ok') — o fallback embutido em `fetchLinhasProducao` (as 4 linhas
  // originais) cobre o instante antes disso sem tela quebrada.
  const [linhasProducao, setLinhasProducao] = useState(
    () => LINHAS_PRODUCAO_TRACKING_PADRAO.map((nome,i)=>({nome, ordem:i}))
  );
  useEffect(() => {
    if(statusIndicadores!=='ok' && statusPedidosCompra!=='ok' && statusTracking!=='ok') return;
    let cancelado = false;
    fetchLinhasProducao().then(rows => { if(!cancelado) setLinhasProducao(rows); });
    return () => { cancelado = true; };
  }, [statusIndicadores, statusPedidosCompra, statusTracking]);
  useEffect(() => {
    if(!supabaseClient) return;
    let cancelado = false;
    const canal = supabaseClient
      .channel('realtime:linhas_producao:tv')
      .on('postgres_changes', {event:'*', schema:'public', table:'linhas_producao'}, () => {
        fetchLinhasProducao().then(rows => { if(!cancelado) setLinhasProducao(rows); });
      })
      .subscribe();
    return () => { cancelado = true; supabaseClient.removeChannel(canal); };
  }, []);

  const [configModalAberto, setConfigModalAberto] = useState(false);

  // Guardas (refs) do status mais recente de Pedidos de Compra/Tracking,
  // só pra troca automática abaixo poder LER o valor atual sem precisar
  // estar nas dependências do useEffect — se `statusPedidosCompra`/
  // `statusTracking` estivessem lá, toda atualização em segundo plano
  // (ex.: cada nova consulta de 5 em 5 min, depois que a tela já carregou
  // pela 1ª vez) recriaria o efeito e reiniciaria a contagem do tempo
  // configurado do zero — a troca automática NUNCA aconteceria no tempo
  // certo. Com o ref, o efeito só olha o status quando o próprio timer
  // dispara, não toda vez que ele muda.
  const statusPedidosCompraRef = useRef(statusPedidosCompra);
  useEffect(() => { statusPedidosCompraRef.current = statusPedidosCompra; }, [statusPedidosCompra]);
  const statusTrackingRef = useRef(statusTracking);
  useEffect(() => { statusTrackingRef.current = statusTracking; }, [statusTracking]);

  // TV sem ninguém mexendo — alterna sozinho entre as duas telas, pra dar
  // tempo de ler cada uma sem precisar de clique manual. "Painel
  // Indicadores" tem um tempo FIXO (`temposConfig.segundosIndicadores`, sem
  // sub-abas). "Tracking Picking" é diferente: tem 4 abas internas de linha
  // (Elétrica/SEM/SSE/SEP + qualquer linha adicionada depois, ver
  // `linhasProducao`) — pedido explícito
  // do cliente foi só trocar de tela DEPOIS de mostrar as 4 (ver
  // `onCicloCompleto` em `TrackingPicking`, que avisa quando isso
  // acontece), nunca num tempo fixo que poderia cortar no meio do ciclo
  // de linhas. Clicar numa aba continua trocando na hora (onChange
  // abaixo); os timers não resetam por causa disso, só seguem no próprio
  // ciclo.
  //
  // A troca só acontece DEPOIS do tempo configurado E com o dado da
  // PRÓXIMA tela já resolvido (`status` != 'loading') — pedido do cliente:
  // "ficar no indicador anterior, só passar pro próximo quando tiver
  // certeza que carregou". Sem essa 2ª condição, a troca sempre acontecia
  // no tempo fixo mesmo que a 1ª consulta daquela tela ainda estivesse em
  // andamento (TV recém-ligada/recarregada, ou rede mais lenta naquele
  // instante) — o rodízio caía numa tela ainda em "Carregando…" e só se
  // corrigia sozinho quando a consulta terminasse, sensação de "flash"
  // repetindo ao longo do dia (relatado pelo cliente). Reavalia de 1 em 1s
  // só enquanto ainda estiver 'loading' — depois da 1ª vez que cada tela
  // carrega, o status nunca mais volta a 'loading' sozinho (só um
  // recarregamento de página reinicia esse estado), então isso nunca
  // atrasa a troca no dia a dia normal.
  useEffect(() => {
    if(tela !== 'indicadores') return;
    let cancelado = false;
    let id;
    function agendarTroca(delayMs){
      id = setTimeout(() => {
        if(cancelado) return;
        if(statusPedidosCompraRef.current === 'loading'){ agendarTroca(1000); return; }
        setTela('pedidosCompra');
      }, delayMs);
    }
    agendarTroca(temposConfig.segundosIndicadores*1000);
    return () => { cancelado = true; clearTimeout(id); };
  }, [tela, temposConfig.segundosIndicadores]);

  // "Pedidos de Compra" (3ª tela, sem sub-abas, mesmo critério de
  // "Indicadores" acima, inclusive a espera pelo status da PRÓXIMA tela
  // antes de trocar) — reaproveita o MESMO tempo configurado
  // (`segundosIndicadores`) em vez de criar um campo de configuração novo
  // só pra ela; dá pra separar depois se o cliente pedir um tempo
  // diferente pra essa tela especificamente.
  useEffect(() => {
    if(tela !== 'pedidosCompra') return;
    let cancelado = false;
    let id;
    function agendarTroca(delayMs){
      id = setTimeout(() => {
        if(cancelado) return;
        if(statusTrackingRef.current === 'loading'){ agendarTroca(1000); return; }
        setTela('picking');
      }, delayMs);
    }
    agendarTroca(temposConfig.segundosIndicadores*1000);
    return () => { cancelado = true; clearTimeout(id); };
  }, [tela, temposConfig.segundosIndicadores]);

  // (Não tem um efeito de tempo fixo aqui pra `tela==='link'` — desde que
  // virou lista de vários links, ela cicla do mesmo jeito que
  // TrackingPicking cicla as linhas: o próprio LinkExternoPanel controla seu
  // ciclo interno (60s por link) e avisa `onCicloCompleto` quando termina o
  // último, fechando o rodízio Indicadores → Elétrica/SEM/SSE/SEP →
  // Link 1..N → Indicadores → ... Ver comentário completo em
  // LinkExternoPanel.)

  // TVs Samsung (Tizen) só entregam pro JavaScript da página as teclas do
  // controle físico que o app REGISTRAR explicitamente antes — por padrão,
  // mesmo o D-pad (setas) pode não chegar em nenhum listener de `keydown`
  // nenhum, sem erro nenhum, só silêncio total (exatamente o sintoma
  // relatado: "nada acontece"). `tizen` só existe no navegador embutido
  // das TVs Samsung — vira um no-op inofensivo em qualquer outro
  // navegador/aparelho (Chrome de PC, webOS, Android TV, etc.).
  useEffect(() => {
    if(typeof tizen==='undefined' || !tizen.tvinputdevice || !tizen.tvinputdevice.registerKey) return;
    try{
      tizen.tvinputdevice.registerKey('ArrowLeft');
      tizen.tvinputdevice.registerKey('ArrowRight');
    }catch(err){
      console.warn('Painel Indicadores: falha ao registrar teclas do controle (Tizen)', err);
    }
  }, []);

  // Controle remoto da TV — ArrowRight avança, ArrowLeft volta, andando
  // pela MESMA sequência de telas que a troca automática já percorre:
  // Indicadores → Elétrica → SEM → SSE → SEP → (Link, se existir) →
  // volta pra Indicadores, cíclico nos dois sentidos. Só troca
  // `tela`/`linhaSelecionada` na hora — EXATAMENTE o que clicar numa aba
  // já fazia antes — nunca cria timer novo nem mexe nos já existentes
  // (acima, e o de 30s dentro de TrackingPicking): eles continuam rodando
  // no próprio ciclo, do mesmo jeito que já ignoravam clique manual antes
  // desta funcionalidade.
  // Anda 1 posição pra frente/trás na MESMA sequência dinâmica que a troca
  // automática já percorre (Indicadores → 4 linhas → 1 posição por link
  // externo cadastrado, cíclico). Extraído numa função só (`useCallback`,
  // pra dar uma referência estável e reaproveitável) porque agora tem 2
  // formas de disparar a mesma navegação: as setas do controle remoto
  // (efeito de `keydown` abaixo) E os botões ‹ › clicáveis na tela (pedido
  // do cliente depois de confirmar que o controle físico dessa TV opera a
  // página em modo ponteiro/mouse, não manda tecla nenhuma — ver
  // BotaoNavegacao/PanelTabs). Nenhuma das duas fontes cria timer novo nem
  // mexe nos já existentes — só troca `tela`/`linhaSelecionada`/`linkIndex`
  // na hora, exatamente como clicar numa aba já fazia.
  const navegar = useCallback((direita) => {
    const posicoes = [{tela:'indicadores'}, {tela:'pedidosCompra'}];
    linhasProducao.forEach(l => posicoes.push({tela:'picking', linha:l.nome}));
    linksExternos.forEach((l, i) => posicoes.push({tela:'link', linkIndex:i}));
    const idxAtual = posicoes.findIndex(p =>
      p.tela===tela &&
      (p.tela!=='picking' || p.linha===linhaSelecionada) &&
      (p.tela!=='link' || p.linkIndex===linkIndex)
    );
    const delta = direita ? 1 : -1;
    const novoIdx = ((idxAtual===-1 ? 0 : idxAtual) + delta + posicoes.length) % posicoes.length;
    const novaPos = posicoes[novoIdx];
    if(novaPos.tela==='picking') setLinhaSelecionada(novaPos.linha);
    if(novaPos.tela==='link') setLinkIndex(novaPos.linkIndex);
    setTela(novaPos.tela);
  }, [tela, linhaSelecionada, linkIndex, linksExternos, linhasProducao]);

  useEffect(() => {
    // Navegadores de TV (Tizen/webOS/Android TV/Fire TV) nem sempre
    // preenchem `e.key` do jeito moderno padrão ("ArrowLeft"/"ArrowRight")
    // pro D-pad do controle físico — muitos ainda mandam o nome antigo
    // ("Left"/"Right", convenção pré-padronização) ou só o `keyCode`
    // numérico (37/39, a mesma dupla desde sempre, mesmo em navegador bem
    // antigo). Checa os 3 formatos pra cobrir o controle remoto de
    // verdade, não só teclado de computador.
    const EH_ESQUERDA = e => e.key==='ArrowLeft' || e.key==='Left' || e.keyCode===37 || e.which===37;
    const EH_DIREITA = e => e.key==='ArrowRight' || e.key==='Right' || e.keyCode===39 || e.which===39;
    function onKeyDown(e){
      const direita = EH_DIREITA(e);
      const esquerda = !direita && EH_ESQUERDA(e);
      if(!direita && !esquerda) return;
      e.preventDefault();
      navegar(direita);
    }
    // `true` (fase de CAPTURA, não a de bubble padrão) — intercepta o
    // evento o mais cedo possível no fluxo, antes de qualquer script da
    // própria TV (navegação espacial entre botões focáveis, comum nesses
    // navegadores) ter chance de consumi-lo primeiro.
    window.addEventListener('keydown', onKeyDown, true);
    return () => window.removeEventListener('keydown', onKeyDown, true);
  }, [navegar]);

  // Cada link/arquivo vira sua PRÓPRIA aba lá em cima, junto de
  // "Indicadores"/"Tracking Picking" (pedido do cliente — nada de fileira
  // de sub-abas separada embaixo, que existia antes disso). Clicar numa
  // dessas abas precisa fazer 2 coisas de uma vez (trocar `tela` E
  // `linkIndex`), então empacota isso num único callback (`onSelecionarLink`)
  // — `PanelTabs` mapeia `links` direto pra gerar 1 botão por item.
  const propsAbaLink = {
    onAbrirConfig: () => setConfigModalAberto(true),
    links: linksExternos,
    linkIndex,
    onSelecionarLink: (i) => { setLinkIndex(i); setTela('link'); },
    onNavegarEsquerda: () => navegar(false),
    onNavegarDireita: () => navegar(true),
  };

  return (
    <React.Fragment>
      {tela==='indicadores' && (
        <PainelIndicadores
          tela={tela} onChange={setTela} theme={theme} onToggleTheme={toggleTheme} ordemVisivel={ordemIndicadores}
          status={statusIndicadores} counts={countsIndicadores} historico={historicoIndicadores} inventariosData={inventariosIndicadores}
          {...propsAbaLink}
        />
      )}
      {tela==='pedidosCompra' && (
        <PedidosCompraPanel
          tela={tela} onChange={setTela} theme={theme} onToggleTheme={toggleTheme}
          status={statusPedidosCompra} pedidos={pedidosCompra} ultimaAtualizacao={ultimaAtualizacaoPedidosCompra}
          {...propsAbaLink}
        />
      )}
      {tela==='picking' && (
        <TrackingPicking
          tela={tela} onChange={setTela} theme={theme} onToggleTheme={toggleTheme}
          onCicloCompleto={() => setTela(temLink ? 'link' : 'indicadores')}
          linhaSelecionada={linhaSelecionada} onChangeLinha={setLinhaSelecionada}
          segundosLinhaTracking={temposConfig.segundosLinhaTracking}
          status={statusTracking} maquinasEtp={maquinasEtpTracking} itens={itensTracking}
          linhasProducao={linhasProducao}
          {...propsAbaLink}
        />
      )}
      {tela==='link' && (
        <LinkExternoPanel
          tela={tela} onChange={setTela} theme={theme} onToggleTheme={toggleTheme}
          onCicloCompleto={() => setTela('indicadores')}
          onChangeLinkIndex={setLinkIndex}
          segundosLink={temposConfig.segundosLink}
          {...propsAbaLink}
        />
      )}
      <ConfiguracoesModal
        open={configModalAberto}
        onClose={() => setConfigModalAberto(false)}
        ordemIndicadores={ordemIndicadores}
        onSalvarIndicadores={setOrdemIndicadores}
        links={linksExternos}
        onCriarLink={criarLinkExterno}
        onAtualizarLink={atualizarLinkExterno}
        onRemoverLink={removerLinkExterno}
        onReordenarLink={salvarOrdemLinksExternos}
        onEnviarArquivoLink={enviarArquivoLinkExterno}
        temposAtuais={temposConfig}
        onSalvarTempos={setTemposConfig}
      />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
