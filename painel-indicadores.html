<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo} = React;

/* ============================================================
   Painel Indicadores — TV do almoxarifado.
   Página ESTÁTICA à parte de index.html (não é uma view da SPA),
   mas busca dado AO VIVO do mesmo Supabase que o app principal usa
   — não é mais um snapshot fixo. Tudo abaixo (client Supabase,
   fetchers, funções de cálculo, componentes de gráfico) é uma
   DUPLICATA proposital do que já existe em index.html (Dashboard e
   vizinhança) — não há import/módulo compartilhado entre os dois
   arquivos, então qualquer mudança na lógica de cálculo de lá
   (computeWeeklyStats, itemAcuracidade, etc.) precisa ser replicada
   aqui manualmente pra os dois não divergirem.

   Autenticação: usa o MESMO client (mesma URL/publishable key) e o
   MESMO storage (sessionStorage) que index.html — quando esta página
   é aberta pelo menu "Painel Indicadores" (window.open, mesma
   origem), o navegador CLONA o sessionStorage da aba que abriu,
   então o token de login já vem "de graça", sem precisar de tela de
   login própria aqui. Se a página for aberta direto (sem passar pelo
   app logado antes), não há sessão — mostra um aviso e cai pra um
   conjunto de dados de exemplo, pra nunca ficar com a tela quebrada
   numa TV do almoxarifado.
   ============================================================ */

const SUPABASE_URL = 'https://geeqfpzamexmeketcecu.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Wx-oyRE86XWz4bTSPWBe5A_8tXRpHJr';
const supabaseClient = window.supabase
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { storage: window.sessionStorage }
    })
  : null;

/* ---- Helpers puros, copiados de index.html ---- */

function reconstructNumericCode(raw){
  let d = String(raw).trim();
  if(!/^[0-9]+$/.test(d)) return d;
  if(d.length===10) d = '0'+d;
  if(d.length===11) return d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,11);
  if(d.length===9) return d.slice(0,3)+'.'+d.slice(3,8)+'.'+d.slice(8,9);
  if(d.length===8) return d.slice(0,3)+'.'+d.slice(3,8);
  return d;
}

function contagemRowToLocal(row){
  return {
    id: row.id,
    productCode: reconstructNumericCode(row.produto_codigo),
    descricao: row.descricao,
    diferenca: row.diferenca,
    saldoSistema: row.saldo_sistema,
    familia: row.familia,
    contagemAnteriorId: row.contagem_anterior_id,
    data: row.data,
  };
}

async function fetchTodasPaginado(buildQuery){
  const PAGE_SIZE = 1000;
  let offset = 0;
  let todas = [];
  while(true){
    const { data, error } = await buildQuery().range(offset, offset + PAGE_SIZE - 1);
    if(error) throw error;
    if(!data || data.length === 0) break;
    todas = todas.concat(data);
    if(data.length < PAGE_SIZE) break;
    offset += PAGE_SIZE;
  }
  return todas;
}

// Select enxuto (só as colunas que os gráficos deste painel usam) — não
// precisa da linha inteira de `contagens` como index.html busca (lá é
// usada pra dezenas de outras telas, aqui só pros 6 gráficos abaixo).
async function fetchContagensParaPainel(){
  if(!supabaseClient) return [];
  const data = await fetchTodasPaginado(() => supabaseClient
    .from('contagens')
    .select('id, produto_codigo, descricao, diferenca, saldo_sistema, familia, contagem_anterior_id, data')
    .order('criado_em', {ascending:false})
    .order('id', {ascending:true}));
  return data.map(contagemRowToLocal);
}

async function fetchHistoricoParaTendencia(){
  if(!supabaseClient) return [];
  const data = await fetchTodasPaginado(() => supabaseClient
    .from('contagens_historico')
    .select('id, produto_codigo, data, diferenca, saldo_sistema, acuracidade, status')
    .order('data', {ascending:false})
    .order('id', {ascending:true}));
  return data.filter(row => !['Recontar','Ajustar'].includes(String(row.status||'').trim()));
}

function ultimaContagemPorDocumento(pool){
  const hasFollowUp = new Set();
  pool.forEach(c=>{ if(c.contagemAnteriorId) hasFollowUp.add(c.contagemAnteriorId); });
  return pool.filter(c=>c.id==null || !hasFollowUp.has(c.id));
}

function getWeekInfo(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const dow = (d.getDay() + 6) % 7;
  const monday = new Date(d);
  monday.setDate(d.getDate() - dow);
  const key = monday.toISOString().slice(0, 10);
  const thursday = new Date(monday);
  thursday.setDate(monday.getDate() + 3);
  const yearStart = new Date(Date.UTC(thursday.getFullYear(), 0, 1));
  const weekNumber = Math.ceil((((thursday - yearStart) / 86400000) + 1) / 7);
  return {
    key,
    weekNumber,
    label: 'Sem ' + weekNumber,
    sublabel: monday.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}),
  };
}

const NOMES_MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function getMonthInfo(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  return {
    key,
    label: NOMES_MESES[d.getMonth()],
    sublabel: String(d.getFullYear()),
  };
}

function itemAcuracidade(c){
  if(c.acuracidade!=null) return c.acuracidade;
  if(c.saldoSistema==null || c.diferenca==null) return null;
  if(c.saldoSistema===0) return c.diferenca===0 ? 1 : 0;
  return Math.max(0, 1 - Math.abs(c.diferenca)/c.saldoSistema);
}

function localDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function hojeLocalStr(){
  return localDateStr(new Date());
}

// Painel fica sempre numa TV, sem controle de filtro interativo — período
// fixo em "últimos 60 dias" (~8-9 semanas), janela parecida com o que o
// cliente costuma olhar na tela Indicadores. Fácil de trocar aqui se
// precisar de outra janela padrão.
function computeTrendRangeFixo(hojeStr){
  const hoje = new Date(hojeStr + 'T00:00:00');
  const d = new Date(hoje); d.setDate(d.getDate() - 59);
  return { from: d.toISOString().slice(0,10), to: hojeStr };
}

function computeWeeklyStats(counts, dataInicioStr, dataFimStr){
  const buckets = {};
  const ordem = [];
  let cursor = new Date(getWeekInfo(dataInicioStr).key + 'T00:00:00');
  const fimMonday = new Date(getWeekInfo(dataFimStr).key + 'T00:00:00');
  let guard = 0;
  while(cursor <= fimMonday && guard < 300){
    const info = getWeekInfo(cursor.toISOString().slice(0,10));
    if(!buckets[info.key]){
      buckets[info.key] = {key:info.key, label:info.label, sublabel:info.sublabel, total:0, somaAcuracidade:0, comAcuracidade:0};
      ordem.push(info.key);
    }
    cursor.setDate(cursor.getDate()+7);
    guard++;
  }
  counts.forEach(c=>{
    if(!c.data) return;
    if(c.data<dataInicioStr || c.data>dataFimStr) return;
    const {key} = getWeekInfo(c.data);
    if(!buckets[key]) return;
    buckets[key].total += 1;
    const acc = itemAcuracidade(c);
    if(acc!=null){
      buckets[key].somaAcuracidade += acc;
      buckets[key].comAcuracidade += 1;
    }
  });
  return ordem.map(key=>{
    const w = buckets[key];
    return {
      key:w.key, label:w.label, sublabel:w.sublabel, total:w.total,
      acuracidade: w.comAcuracidade>0 ? (w.somaAcuracidade/w.comAcuracidade)*100 : null,
    };
  });
}

function computeMonthlyStats(counts, dataInicioStr, dataFimStr){
  const buckets = {};
  const ordem = [];
  let cursor = new Date(dataInicioStr + 'T00:00:00');
  cursor.setDate(1);
  const fim = new Date(dataFimStr + 'T00:00:00');
  fim.setDate(1);
  let guard = 0;
  while(cursor <= fim && guard < 120){
    const info = getMonthInfo(cursor.toISOString().slice(0,10));
    if(!buckets[info.key]){
      buckets[info.key] = {key:info.key, label:info.label, sublabel:info.sublabel, total:0, somaAcuracidade:0, comAcuracidade:0};
      ordem.push(info.key);
    }
    cursor.setMonth(cursor.getMonth()+1);
    guard++;
  }
  counts.forEach(c=>{
    if(!c.data) return;
    const {key} = getMonthInfo(c.data);
    if(!buckets[key]) return;
    buckets[key].total += 1;
    const acc = itemAcuracidade(c);
    if(acc!=null){
      buckets[key].somaAcuracidade += acc;
      buckets[key].comAcuracidade += 1;
    }
  });
  return ordem.map(key=>{
    const w = buckets[key];
    return {
      key:w.key, label:w.label, sublabel:w.sublabel, total:w.total,
      acuracidade: w.comAcuracidade>0 ? (w.somaAcuracidade/w.comAcuracidade)*100 : null,
    };
  });
}

function buildPoolTendencia(counts, historicoParaTendencia){
  const historicoComoContagem = (historicoParaTendencia||[])
    .filter(h=>h.data)
    .map(h=>({data:h.data, diferenca:h.diferenca, saldoSistema:h.saldo_sistema, acuracidade:h.acuracidade}));
  return [...counts, ...historicoComoContagem];
}

function niceAxisTicks(maxVal, targetTicks){
  if(maxVal<=0) return [0, 10];
  const rawStep = maxVal / targetTicks;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const residual = rawStep / magnitude;
  const niceResidual = residual<=1 ? 1 : residual<=2 ? 2 : residual<=5 ? 5 : 10;
  const step = niceResidual * magnitude;
  const ticks = [0];
  while(ticks[ticks.length-1] < maxVal - 1e-9) ticks.push(ticks[ticks.length-1] + step);
  return ticks;
}

const WEEKLY_CHART_COLOR = '#0D9488';
const META_ACURACIDADE_SEMANAL = 95;
const META_CONTAGENS_SEMANAL = 250;

/* ---- Componentes de gráfico, copiados de index.html ---- */

function WeeklyLineChart({weeks, meta=META_ACURACIDADE_SEMANAL}){
  const W = 760, H = 220, padL = 34, padR = 30, padT = 34, padB = 40;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const n = weeks.length;
  const x = i => padL + (n>1 ? (i/(n-1))*chartW : chartW/2);
  const y = v => padT + chartH - (v/100)*chartH;
  const segmentos = [];
  let atual = [];
  weeks.forEach((w,i)=>{
    if(w.acuracidade!=null) atual.push(i);
    else if(atual.length){ segmentos.push(atual); atual = []; }
  });
  if(atual.length) segmentos.push(atual);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}} role="img" aria-label="Gráfico de acuracidade semanal">
      {[0,25,50,75,100].map(t=>(
        <g key={t}>
          <line x1={padL} x2={W-padR} y1={y(t)} y2={y(t)} stroke="var(--line)" strokeWidth={1} strokeDasharray="3,3" />
          <text x={padL-8} y={y(t)+3.5} textAnchor="end" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{t}%</text>
        </g>
      ))}
      <line x1={padL} x2={W-padR} y1={y(meta)} y2={y(meta)} stroke={WEEKLY_CHART_COLOR} strokeWidth={1.5} strokeDasharray="5,4" opacity={0.65}>
        <title>Meta: {meta}%</title>
      </line>
      {segmentos.map((seg,si)=>{
        const pts = seg.map(i=>`${x(i)},${y(weeks[i].acuracidade)}`).join(' ');
        const area = `${x(seg[0])},${y(0)} ${pts} ${x(seg[seg.length-1])},${y(0)}`;
        return (
          <g key={si}>
            <polygon points={area} fill={WEEKLY_CHART_COLOR} opacity={0.12} />
            <polyline points={pts} fill="none" stroke={WEEKLY_CHART_COLOR} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round" />
          </g>
        );
      })}
      {weeks.map((w,i)=>{
        const anchor = i===0 ? 'start' : (i===weeks.length-1 ? 'end' : 'middle');
        const labelX = i===0 ? x(i)+5 : (i===weeks.length-1 ? x(i)-5 : x(i));
        return (
        <g key={w.key}>
          {w.acuracidade!=null ? (
            <>
              <circle cx={x(i)} cy={y(w.acuracidade)} r={4} fill={WEEKLY_CHART_COLOR} stroke="var(--panel)" strokeWidth={2}>
                <title>{w.label} ({w.sublabel}): {w.acuracidade.toFixed(1)}% · {w.total} contagem(ns)</title>
              </circle>
              <text x={labelX} y={Math.max(y(w.acuracidade)-11, padT+14)} textAnchor={anchor} fontSize={11} fontWeight={700} fill="var(--ink)" fontFamily="var(--font-mono)">{Math.round(w.acuracidade)}%</text>
            </>
          ) : (
            <circle cx={x(i)} cy={y(0)} r={2.5} fill="var(--ink-dim)" opacity={0.5}>
              <title>{w.label} ({w.sublabel}): sem contagens</title>
            </circle>
          )}
          <text x={x(i)} y={H-24} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{w.label}</text>
          <text x={x(i)} y={H-11} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{w.sublabel}</text>
        </g>
        );
      })}
    </svg>
  );
}

function WeeklyCountChart({weeks, meta=META_CONTAGENS_SEMANAL}){
  const W = 760, H = 220, padL = 34, padR = 30, padT = 34, padB = 40;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const n = weeks.length;
  const ticks = niceAxisTicks(Math.max(...weeks.map(w=>w.total), meta, 1), 4);
  const maxVal = ticks[ticks.length-1];
  const slot = chartW / n;
  const barW = Math.min(40, slot * 0.5);
  const x = i => padL + i*slot + slot/2;
  const y = v => padT + chartH - (v/maxVal)*chartH;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}} role="img" aria-label="Gráfico de contagens por semana">
      {ticks.map(t=>(
        <g key={t}>
          <line x1={padL} x2={W-padR} y1={y(t)} y2={y(t)} stroke="var(--line)" strokeWidth={1} strokeDasharray="3,3" />
          <text x={padL-8} y={y(t)+3.5} textAnchor="end" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{Math.round(t)}</text>
        </g>
      ))}
      <line x1={padL} x2={W-padR} y1={y(meta)} y2={y(meta)} stroke={WEEKLY_CHART_COLOR} strokeWidth={1.5} strokeDasharray="5,4" opacity={0.65}>
        <title>Meta: {meta}</title>
      </line>
      {weeks.map((w,i)=>(
        <g key={w.key}>
          <rect x={x(i)-barW/2} y={y(w.total)} width={barW} height={Math.max(0, y(0)-y(w.total))} rx={4} fill={WEEKLY_CHART_COLOR}>
            <title>{w.label} ({w.sublabel}): {w.total} contagem(ns)</title>
          </rect>
          <text x={x(i)} y={y(w.total)-8} textAnchor="middle" fontSize={11} fontWeight={700} fill="var(--ink)" fontFamily="var(--font-mono)">{w.total}</text>
          <text x={x(i)} y={H-24} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{w.label}</text>
          <text x={x(i)} y={H-11} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{w.sublabel}</text>
        </g>
      ))}
    </svg>
  );
}

function MonthlyAccuracyBarChart({months, meta=META_ACURACIDADE_SEMANAL}){
  const W = 760, H = 220, padL = 34, padR = 30, padT = 38, padB = 40;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const n = months.length;
  const slot = chartW / n;
  const barW = Math.min(48, slot * 0.55);
  const x = i => padL + i*slot + slot/2;
  const y = v => padT + chartH - (v/100)*chartH;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}} role="img" aria-label="Gráfico de acuracidade mensal">
      {[0,25,50,75,100].map(t=>(
        <g key={t}>
          <line x1={padL} x2={W-padR} y1={y(t)} y2={y(t)} stroke="var(--line)" strokeWidth={1} strokeDasharray="3,3" />
          <text x={padL-8} y={y(t)+3.5} textAnchor="end" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{t}%</text>
        </g>
      ))}
      <line x1={padL} x2={W-padR} y1={y(meta)} y2={y(meta)} stroke={WEEKLY_CHART_COLOR} strokeWidth={1.5} strokeDasharray="5,4" opacity={0.65}>
        <title>Meta: {meta}%</title>
      </line>
      {months.map((m,i)=>(
        <g key={m.key}>
          {m.acuracidade!=null ? (
            <>
              <rect x={x(i)-barW/2} y={y(m.acuracidade)} width={barW} height={Math.max(0, y(0)-y(m.acuracidade))} rx={4} fill={WEEKLY_CHART_COLOR}>
                <title>{m.label} ({m.sublabel}): {m.acuracidade.toFixed(1)}% · {m.total} contagem(ns)</title>
              </rect>
              <text x={x(i)} y={y(m.acuracidade)-8} textAnchor="middle" fontSize={11} fontWeight={700} fill="var(--ink)" fontFamily="var(--font-mono)">{Math.round(m.acuracidade)}%</text>
            </>
          ) : (
            <text x={x(i)} y={y(0)-8} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">0%</text>
          )}
          <text x={x(i)} y={H-24} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{m.label}</text>
          <text x={x(i)} y={H-11} textAnchor="middle" fontSize={10} fill="var(--ink-dim)" fontFamily="var(--font-mono)">{m.sublabel}</text>
        </g>
      ))}
    </svg>
  );
}

function PnlDonut({segments, size=168, strokeWidth=22, centerLabel='inventários'}){
  const r = (size - strokeWidth) / 2;
  const c = 2 * Math.PI * r;
  const total = segments.reduce((s, x) => s + x.value, 0);
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--gray-100)" strokeWidth={strokeWidth} />
      {total > 0 && segments.map((seg, i) => {
        if (seg.value <= 0) return null;
        const len = (seg.value / total) * c;
        const dashoffset = -offset;
        offset += len;
        return (
          <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={seg.color} strokeWidth={strokeWidth}
            strokeDasharray={`${len} ${c - len}`} strokeDashoffset={dashoffset}
            transform={`rotate(-90 ${size/2} ${size/2})`} />
        );
      })}
      <text x="50%" y="47%" textAnchor="middle" fontSize="24" fontWeight="700" fill="var(--navy)" fontFamily="Inter, sans-serif">{total}</text>
      <text x="50%" y="63%" textAnchor="middle" fontSize="10.5" fill="var(--gray-500)" fontFamily="Inter, sans-serif">{centerLabel}</text>
    </svg>
  );
}

/* ---- Componente principal ---- */

function PainelIndicadores(){
  const [status, setStatus] = useState('loading'); // loading | ok | sem-sessao | erro
  const [counts, setCounts] = useState([]);
  const [historico, setHistorico] = useState([]);
  const [ultimaAtualizacao, setUltimaAtualizacao] = useState(null);
  const [relogio, setRelogio] = useState(new Date());

  useEffect(()=>{
    const id = setInterval(()=>setRelogio(new Date()), 30000);
    return ()=>clearInterval(id);
  }, []);

  async function carregarDados(){
    if(!supabaseClient){ setStatus('erro'); return; }
    try{
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if(!sessionData || !sessionData.session){
        setStatus('sem-sessao');
        return;
      }
      const [countsData, historicoData] = await Promise.all([
        fetchContagensParaPainel(),
        fetchHistoricoParaTendencia(),
      ]);
      setCounts(countsData);
      setHistorico(historicoData);
      setUltimaAtualizacao(new Date());
      setStatus('ok');
    }catch(err){
      console.warn('Painel Indicadores: falha ao carregar dados ao vivo', err);
      setStatus('erro');
    }
  }

  useEffect(()=>{
    carregarDados();
    // Atualização automática a cada 5 minutos — pedido do cliente pra TV
    // do almoxarifado ficar sempre com dado recente, sem precisar de
    // ninguém dar F5 manualmente.
    const id = setInterval(carregarDados, 5*60*1000);
    return ()=>clearInterval(id);
  }, []);

  const dadosAoVivo = status==='ok';

  const calc = useMemo(()=>{
    if(!dadosAoVivo) return null;
    const hojeStr = hojeLocalStr();
    const {from: dataInicioStr, to: dataFimStr} = computeTrendRangeFixo(hojeStr);
    const poolTendencia = buildPoolTendencia(counts, historico);
    const poolTendenciaDedup = ultimaContagemPorDocumento(poolTendencia);

    const weeklyStats = computeWeeklyStats(poolTendencia, dataInicioStr, dataFimStr);
    const weeklyStatsItensUnicos = computeWeeklyStats(poolTendenciaDedup, dataInicioStr, dataFimStr);

    const anoAtualStr = String(new Date().getFullYear()) + '-01-01';
    const monthlyStats = computeMonthlyStats(poolTendencia, anoAtualStr, hojeStr);

    const poolTendenciaNoPeriodo = poolTendenciaDedup.filter(c=>c.data && c.data>=dataInicioStr && c.data<=dataFimStr);
    const pizzaTotalContado = poolTendenciaNoPeriodo.length;
    const pizzaDivergentes = poolTendenciaNoPeriodo.filter(c=>c.diferenca!==0 && c.diferenca!==null).length;
    const pizzaSemDivergencia = pizzaTotalContado - pizzaDivergentes;

    // Família/Grupo só existe em contagem AO VIVO (não em histórico
    // importado) — mesmo critério de index.html, ver comentário original
    // perto de `porFamiliaObj` em Dashboard.
    const todasParaQualidade = ultimaContagemPorDocumento(counts);
    const divergentes = todasParaQualidade.filter(c=>c.diferenca!==0 && c.diferenca!==null);
    const divergentesNoPeriodo = divergentes.filter(c=>c.data && c.data>=dataInicioStr && c.data<=dataFimStr);
    const porFamiliaObj = {};
    divergentesNoPeriodo.forEach(c=>{ if(c.familia) porFamiliaObj[c.familia] = (porFamiliaObj[c.familia]||0)+1; });
    const porFamilia = Object.entries(porFamiliaObj).sort((a,b)=>b[1]-a[1]).slice(0,7);

    return {
      dataInicioStr, dataFimStr, weeklyStats, weeklyStatsItensUnicos, monthlyStats,
      pizzaTotalContado, pizzaDivergentes, pizzaSemDivergencia, porFamilia,
    };
  }, [dadosAoVivo, counts, historico]);

  const weeklyStats = calc ? calc.weeklyStats : DEMO_WEEKLY;
  const weeklyStatsItensUnicos = calc ? calc.weeklyStatsItensUnicos : DEMO_WEEKLY_ITENS;
  const monthlyStats = calc ? calc.monthlyStats : DEMO_MONTHLY;
  const porFamilia = calc ? calc.porFamilia : DEMO_FAMILIA;
  const maxFamilia = Math.max(1, ...porFamilia.map(([,n])=>n));
  const pizzaTotalContado = calc ? calc.pizzaTotalContado : DEMO_PIZZA.total;
  const pizzaDivergentes = calc ? calc.pizzaDivergentes : DEMO_PIZZA.divergentes;
  const pizzaSemDivergencia = calc ? calc.pizzaSemDivergencia : DEMO_PIZZA.semDivergencia;
  const pizzaSegments = [
    {label:'Sem divergência', value:pizzaSemDivergencia, color:'var(--ok)'},
    {label:'Divergentes', value:pizzaDivergentes, color:'var(--danger)'},
  ];

  const horaFmt = relogio.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const ultimaAtualizacaoFmt = ultimaAtualizacao
    ? ultimaAtualizacao.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
    : null;

  return (
    <div className="content">
      <div className="page-head">
        <div>
          <div className="page-title">Painel Indicadores</div>
          <div className="page-subtitle">
            Mesmo painel "Tendência" da tela Indicadores{calc ? ` · período: últimos 60 dias (até ${horaFmt})` : ''}
          </div>
        </div>
        {status==='loading' && <span className="status-pill loading"><span className="dot"></span>Carregando dados ao vivo…</span>}
        {status==='ok' && <span className="status-pill ok"><span className="dot"></span>Ao vivo · atualizado às {ultimaAtualizacaoFmt}</span>}
        {status==='sem-sessao' && <span className="status-pill warn"><span className="dot"></span>Exemplo · sem sessão ativa</span>}
        {status==='erro' && <span className="status-pill warn"><span className="dot"></span>Exemplo · falha ao carregar dados</span>}
      </div>

      {status==='sem-sessao' && (
        <div className="demo-banner">
          Esta página está mostrando dados de EXEMPLO. Para ver os números reais, abra "Painel Indicadores" pelo
          menu do sistema (logado, abaixo de "Início") — abrir este link direto, sem estar logado, não carrega dado ao vivo.
        </div>
      )}
      {status==='erro' && (
        <div className="demo-banner">
          Não foi possível buscar os dados ao vivo agora (mostrando exemplo). A próxima tentativa automática acontece em até 5 minutos.
        </div>
      )}

      <div className="weekly-charts-grid">
        <div className="weekly-pair-row">
          <div className="panel" style={{margin:0}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:16}}>
              <div style={{fontSize:'var(--text-sm)',fontWeight:700}}>Acuracidade Semanal (%)</div>
              <span className="chart-meta-badge">Meta: {META_ACURACIDADE_SEMANAL}%</span>
            </div>
            <WeeklyLineChart weeks={weeklyStats} meta={META_ACURACIDADE_SEMANAL} />
          </div>
          <div className="panel" style={{margin:0}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:16}}>
              <div style={{fontSize:'var(--text-sm)',fontWeight:700}}>Contagens na Semana</div>
              <span className="chart-meta-badge">Meta: {META_CONTAGENS_SEMANAL}</span>
            </div>
            <WeeklyCountChart weeks={weeklyStats} meta={META_CONTAGENS_SEMANAL} />
          </div>
        </div>

        <div className="weekly-pair-row">
          <div className="panel" style={{margin:0}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:16}}>
              <div>
                <div style={{fontSize:'var(--text-sm)',fontWeight:700}}>Acuracidade Mensal (%)</div>
                <div style={{fontSize:'var(--text-xs)',color:'var(--ink-dim)',marginTop:2}}>Todos os meses de {new Date().getFullYear()} com dado registrado</div>
              </div>
              <span className="chart-meta-badge">Meta: {META_ACURACIDADE_SEMANAL}%</span>
            </div>
            <MonthlyAccuracyBarChart months={monthlyStats} meta={META_ACURACIDADE_SEMANAL} />
          </div>
          <div className="panel" style={{margin:0,display:'flex',flexDirection:'column'}}>
            <div style={{fontSize:'var(--text-sm)',fontWeight:700,marginBottom:16}}>Divergência por Família/Grupo (Top 7)</div>
            <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center'}}>
              {porFamilia.length===0 ? (
                <div className="empty-msg">Ainda sem dado suficiente pra esse indicador no período.</div>
              ) : porFamilia.map(([fam,n])=>(
                <div key={fam} className="bar-row">
                  <div className="bl" style={{width:160}}>{fam}</div>
                  <div className="bar-track"><div className="bar-fill" style={{width:(n/maxFamilia*100)+'%', background:'var(--teal)'}}><span>{n}</span></div></div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div className="weekly-pair-row">
          <div className="panel" style={{margin:0}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:16}}>
              <div>
                <div style={{fontSize:'var(--text-sm)',fontWeight:700}}>Contados × Divergências</div>
                <div style={{fontSize:'var(--text-xs)',color:'var(--ink-dim)',marginTop:2}}>Quantidade total contada no período, separada por divergência.</div>
              </div>
              <span className="chart-meta-badge">{pizzaTotalContado>0 ? Math.round(pizzaDivergentes/pizzaTotalContado*100) : 0}% divergente</span>
            </div>
            {pizzaTotalContado===0 ? (
              <div className="empty-msg">Nenhuma contagem no período.</div>
            ) : (
              <div className="pnl-donut-wrap">
                <PnlDonut segments={pizzaSegments} centerLabel="contados" />
                <div className="pnl-donut-legend">
                  {pizzaSegments.map(s=>(
                    <div key={s.label} className="pnl-legend-row">
                      <span className="pnl-legend-dot" style={{background:s.color}}></span>
                      {s.label}
                      <span className="n">{s.value} · {pizzaTotalContado>0 ? Math.round(s.value/pizzaTotalContado*100) : 0}%</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
          <div className="panel" style={{margin:0}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:16}}>
              <div>
                <div style={{fontSize:'var(--text-sm)',fontWeight:700}}>Itens Contados na Semana</div>
                <div style={{fontSize:'var(--text-xs)',color:'var(--ink-dim)',marginTop:2}}>Cada item conta uma vez só, mesmo se recontado.</div>
              </div>
              <span className="chart-meta-badge">Meta: {META_CONTAGENS_SEMANAL}</span>
            </div>
            <WeeklyCountChart weeks={weeklyStatsItensUnicos} meta={META_CONTAGENS_SEMANAL} />
          </div>
        </div>
      </div>
    </div>
  );
}
